  // que podria tapar els punts si compartissin pane. Amb un pane propi de
  // z-index més alt, els punts sempre queden per sobre, independentment
  // d'aquest reordenament.
  map.createPane('punts-pane');
  map.getPane('punts-pane').style.zIndex = 450;

  // Text del rètol d'un punt: "nom de la producció - municipi" quan el
  // full té el municipi de rodatge omplert per a aquesta ubicació; si no
  // (columna encara buida o no afegida), es manté el format anterior amb
  // la comarca com a referència.
  function etiquetaUbicacio(p, u) {
    if (u.municipi) return `${p.nom} - ${u.municipi}`;
    return p.ubicacions.length > 1 ? `${p.nom} (${u.comarca})` : p.nom;
  }

  // Reparteix els cartellets al voltant del seu punt (dalt/baix/dreta/
  // esquerra, i variants desplaçades en diagonal) perquè no acabin
  // superposats ni entre ells ni amb el nom de la seva comarca (etiqueta
  // permanent, sempre present al mapa). En lloc d'una distància fixa entre
  // punts (massa poc precisa: no tenia en compte la llargada real del
  // text), es calcula el rectangle real que ocuparà cada cartellet — a
  // partir del seu text i la mida de lletra actual — i es tria, per a cada
  // marcador, la direcció amb menys xocs contra els cartellets ja
  // col·locats i contra l'etiqueta de la seva comarca (marcador._comarcaNom,
  // fixat en crear cada marcador). Les 4 variants diagonals (a més de les 4
  // cardinals) donen més marge en zones amb molts punts molt junts (p. ex.
  // Lleida ciutat, amb 3-4 produccions gairebé a sobre les unes de les
  // altres): Leaflet no té una direcció pròpia "diagonal", però un
  // desplaçament horitzontal afegit a l'offset d'una direcció top/bottom ja
  // desplaça tot el cartellet cap a un costat.
  const DIRECCIONS_CARTELLET = [
    { key: 'top', offset: [0, -6] },
    { key: 'bottom', offset: [0, 6] },
    { key: 'right', offset: [9, 0] },
    { key: 'left', offset: [-9, 0] },
    { key: 'top', offset: [16, -6] },
    { key: 'top', offset: [-16, -6] },
    { key: 'bottom', offset: [16, 6] },
    { key: 'bottom', offset: [-16, 6] },
    // Nivells apilats a sobre/sota, sense desplaçament horitzontal: calen
    // en clústers de punts pràcticament superposats (p. ex. Agramunt, amb
    // 4 produccions gairebé al mateix lloc), on els punts són massa a
    // prop entre ells perquè un simple desplaçament lateral separi
    // cartellets tan amples com els seus noms.
    { key: 'top', offset: [0, -24] },
    { key: 'bottom', offset: [0, 24] },
    { key: 'top', offset: [0, -42] },
    { key: 'bottom', offset: [0, 42] }
  ];

  // Punts concrets on l'anti-solapament automàtic no dona el resultat
  // correcte (p. ex. xoca amb l'etiqueta d'una comarca veïna, que no es té
  // en compte com a obstacle) i cal forçar-los la direcció a mà. Clau:
  // "nom producció|comarca" (una producció amb diverses ubicacions pot
  // necessitar forçar-ne només una).
  const DIRECCIO_FORÇADA = {
    'SHADES OF PARADISE|Segarra': 'bottom',
    'VIDEOCLIP ANTIGA ACADEMIA|Urgell': 'left',
    // L'Equilibri i Túnel de Montclar són a Mollerussa, a menys d'1 km:
    // l'automàtic els acaba apilant amunt/avall amb offsets grans, deixant
    // massa buit entre punt i cartellet. Es posen de costat en comptes.
    "L'EQUILIBRI|Pla d'Urgell": 'left',
    'TÚNEL DE MONTCLAR|Pla d\'Urgell': 'right',
    'TRAUMATIC|Pla d\'Urgell': 'bottom',
    // Nena Beata i Curt Eccit Camarasa són molt a prop dins Noguera:
    // l'automàtic hi deixava massa espai buit entre punt i cartellet.
    'CURT ECCIT CAMARASA|Noguera': 'right',
    'ARQUITECTURA EN DESÚS|Urgell': 'right'
  };
  function direccioForçada(p, u) {
    return DIRECCIO_FORÇADA[`${p.nom}|${u.comarca}`] || null;
  }

  // Mides aproximades d'un cartellet (CSS .punt-produccio-label: font-size
  // 11.5px, padding 4px 7px): amplada mitjana de caràcter i alçada de línia
  // estimades, prou properes a la real per detectar solapaments sense
  // haver d'obrir el tooltip abans d'hora només per mesurar-lo.
  const AMPLADA_CARACTER_CARTELLET = 6.8;
  const ALCADA_CARTELLET = 23;
  function rectangleCartell(cx, cy, direccioKey, text) {
    const amplada = text.length * AMPLADA_CARACTER_CARTELLET + 16;
    let left, top;
    if (direccioKey === 'top') { left = cx - amplada / 2; top = cy - ALCADA_CARTELLET; }
    else if (direccioKey === 'bottom') { left = cx - amplada / 2; top = cy; }
    else if (direccioKey === 'right') { left = cx; top = cy - ALCADA_CARTELLET / 2; }
    else { left = cx - amplada; top = cy - ALCADA_CARTELLET / 2; }
    return { left, right: left + amplada, top, bottom: top + ALCADA_CARTELLET };
  }
  function rectanglesXoquen(a, b) {
    return a.left < b.right && a.right > b.left && a.top < b.bottom && a.bottom > b.top;
  }

  const MARGE_OBSTACLE_ETIQUETA = 6;
  function rectangleEtiquetaComarca(nomComarca) {
    if (!nomComarca) return null;
    const els = document.querySelectorAll('.comarca-label, .comarca-label-context');
    for (const el of els) {
      if (el.textContent === nomComarca) {
        const r = el.getBoundingClientRect();
        return {
          left: r.left - MARGE_OBSTACLE_ETIQUETA,
          right: r.right + MARGE_OBSTACLE_ETIQUETA,
          top: r.top - MARGE_OBSTACLE_ETIQUETA,
          bottom: r.bottom + MARGE_OBSTACLE_ETIQUETA
        };
      }
    }
    return null;
  }

  function evitaSolapamentCartellets(marcadors) {
    const mapRect = map.getContainer().getBoundingClientRect();
    const rectanglesColocats = [];
    marcadors.forEach(marcador => {
      const tooltip = marcador.getTooltip();
      if (!tooltip) return;
      const text = String(tooltip.getContent());
      const punt = map.latLngToContainerPoint(marcador.getLatLng());
      const cx = mapRect.left + punt.x, cy = mapRect.top + punt.y;
      const obstacle = rectangleEtiquetaComarca(marcador._comarcaNom);
      // marcador._direccioForçada (vegeu DIRECCIO_FORÇADA): si hi és,
      // només es proven les variants d'aquella direcció (les diagonals hi
      // continuen ajudant a evitar altres cartellets), mai les altres 3
      // direccions cardinals.
      const candidates = marcador._direccioForçada
        ? DIRECCIONS_CARTELLET.filter(d => d.key === marcador._direccioForçada)
        : DIRECCIONS_CARTELLET;
      let millorOpcio = null, millorRectangle = null, menysXocs = Infinity;
      candidates.forEach(d => {
        const rect = rectangleCartell(cx + d.offset[0], cy + d.offset[1], d.key, text);
        let xocs = rectanglesColocats.filter(r => rectanglesXoquen(rect, r)).length;
        if (obstacle && rectanglesXoquen(rect, obstacle)) xocs += 1;
        if (xocs < menysXocs) {
          menysXocs = xocs;
          millorOpcio = d;
          millorRectangle = rect;
        }
      });
      rectanglesColocats.push(millorRectangle);
      tooltip.options.direction = millorOpcio.key;
      tooltip.options.offset = L.point(millorOpcio.offset);
    });
  }

  // Punt destacat: només n'hi ha un alhora (seleccionar-ne un altre fa
  // desaparèixer l'anterior).
  // (capaSeleccionada ja es declara més amunt, a prop de zoomBase)
  let filaSeleccionadaEl = null;
  let nomSeleccionat = null;
  // Moment (Date.now()) en què es va fixar nomSeleccionat per última
  // vegada: permet distingir un doble clic real (dues seleccions de la
  // mateixa producció separades per una fracció de segon, típicament
  // acompanyades del zoom natiu del navegador/Leaflet) d'un segon clic
  // deliberat per desmarcar. Vegeu el seu ús a seleccionaProduccio().
  let momentUltimaSeleccio = 0;
  const FINESTRA_IGNORA_DOBLE_CLIC = 400;

  // Puja la fila seleccionada de la llista de produccions fins que quedi a
  // la zona mig-dalt (no enganxada del tot a la vora superior, com faria
  // scrollIntoView({block:'start'}), ni centrada): es calcula a mà perquè
  // scrollIntoView només ofereix 'start'/'center'/'end'/'nearest', sense
  // cap opció intermèdia.
  const sidePanelEl = document.getElementById('side-panel');
  const FRACCIO_MARGE_SUPERIOR_SELECCIO = 0.18;
  function mostraFilaSeleccionada(el) {
    const contenidorRect = sidePanelEl.getBoundingClientRect();
    const filaRect = el.getBoundingClientRect();
    const desplaçament = (filaRect.top - contenidorRect.top) - sidePanelEl.clientHeight * FRACCIO_MARGE_SUPERIOR_SELECCIO;
    const maxScroll = sidePanelEl.scrollHeight - sidePanelEl.clientHeight;
    sidePanelEl.scrollTop = Math.max(0, Math.min(sidePanelEl.scrollTop + desplaçament, maxScroll));
  }
  // Si la selecció actual s'ha fet amb zoom + marcador destacat (des de la
  // llista) o només marcant la fila (des d'un punt/cartellet ja visible al
  // mapa). Cal recordar-ho per saber, en desseleccionar, si també s'ha de
  // tornar a portar el mapa al centre (desfixaProduccio) o no.
  let seleccioAmbZoom = false;

  // Mentre el mapa torna cap al centre en desseleccionar una producció
  // (desfixaProduccio), es manté a true fins que el flyTo hi arriba de debò
  // (moveend): igual que plegantComarca, el hover d'altres comarques queda
  // desactivat durant aquest instant, perquè no aparegui el popup enmig
  // del zoom out.
  let desfixantProduccio = false;

  // Neteja només els elements visuals de la selecció (capa de punts, fila
  // ressaltada a la llista), sense tocar la restricció d'arrossegament del
  // mapa. Es fa servir en CANVIAR de producció seleccionada: si es
  // restaurés aquí la restricció normal (com feia abans), podia disparar
  // una correcció sobtada de la vista un instant abans de començar el
  // moviment cap a la nova producció — es notava sobretot amb produccions
  // de diverses ubicacions.
  //
  // mantenirScroll: true quan la crida ve d'un clic directe a la llista
  // (seleccionaProduccio amb opcions.origenLlista): la fila ja és visible
  // just on l'usuari l'ha clicat, així que el scroll no s'ha de tocar. Sense
  // això, aquest reset a 0 saltava sempre abans de marcar la nova fila,
  // deixant la llista amunt de tot i la fila clicada fora de vista.
  function netejaSeleccioProduccio(mantenirScroll) {
    if (capaSeleccionada) {
      map.removeLayer(capaSeleccionada);
      capaSeleccionada = null;
    }
    // Treu l'anell polsant de selecció (vegeu punt-seleccio-polsa a la CSS)
    // d'on hagi quedat: al punt destacat de capaSeleccionada (ja eliminat a
    // dalt) o, si la selecció venia d'un punt/cartellet ja visible dins una
    // comarca expandida (opcions.nomesLlista), al seu propi cartellet
    // permanent dins capaPuntsComarca, que NO es destrueix en desseleccionar.
    document.querySelectorAll('.punt-produccio-label-seleccionat').forEach(el => {
      el.classList.remove('punt-produccio-label-seleccionat');
    });
    if (filaSeleccionadaEl) {
      filaSeleccionadaEl.classList.remove('seleccionada');
      filaSeleccionadaEl = null;
      // Sense cap producció seleccionada, la llista torna a dalt de tot.
      // Si tot seguit es marca una nova fila (canvi de selecció) que no ve
      // de la llista, el propi mostraFilaSeleccionada() ho sobreescriu
      // abans que el navegador arribi a pintar aquest scrollTop=0, així que
      // no hi ha cap salt visible pel mig.
      if (!mantenirScroll) sidePanelEl.scrollTop = 0;
    }
    nomSeleccionat = null;
  }

  // Desselecciona del tot (no hi ha cap nova selecció a continuació): a
  // més de netejar la visual, restaura la restricció normal
  // d'arrossegament del mapa i torna a portar el mapa al centre/zoom
  // inicial (les 6 comarques senceres), en lloc de deixar-lo on hagués
  // quedat l'última selecció.
  function desfixaProduccio() {
    // Atura qualsevol animació flyTo/flyToBounds encara en curs abans de
    // llançar-ne una de nova: si es deixa en marxa, la correcció de
    // maxBounds xoca amb els fotogrames pendents del flyTo anterior — és
    // el que feia que els punts "es buguegessin" en clicar/desclicar
    // produccions ràpidament.
    map.stop();
    netejaSeleccioProduccio();
    // NO es crida actualitzaLimitsSegonsZoom() aquí (com sí que es feia
    // abans): fer-ho ABANS del flyTo cridava setMaxBounds() amb la vista
    // encara al zoom apropat de la selecció, i per a ubicacions a prop de
    // la vora de les 16 comarques carregades això sobresortia dels nous
    // límits — Leaflet corregeix els maxBounds a l'instant (sense animar),
    // fent que el mapa "saltés" de cop a una posició equivocada abans que
    // ni tan sols comencés el flyTo cap al centre. En comptes d'això, es
    // deixa que ho faci el listener de 'zoomend' (ja registrat més amunt)
    // un cop el flyTo hagi arribat de debò al zoom mínim final — exactament
    // com ja fa seleccionaProduccio() per al seu propi flyTo.
    desfixantProduccio = true;
    map.once('moveend', () => { desfixantProduccio = false; });
    map.flyTo(targetBounds.getCenter(), zoomBase, { duration: 0.7, easeLinearity: 0.2 });
  }

  // Funciona com una casella de selecció: clicar la mateixa producció que
  // ja està seleccionada la desmarca; clicar-ne una altra substitueix la
  // selecció. Una producció repartida entre diverses comarques pot tenir
  // més d'una ubicació de rodatge: totes hi apareixen alhora.
  //
  // opcions.nomesLlista: true quan el clic ve d'un punt o cartellet ja
  // visible al mapa (amb una comarca expandida) — en aquest cas el punt
  // ja s'hi veu, així que NOMÉS es marca la fila
  // corresponent a la llista: no es mou el mapa, no es crea cap marcador
  // destacat, i la resta de punts es mantenen exactament igual (no es
  // plega la comarca expandida ni res). Des de la llista (sense aquesta
  // opció) es manté el comportament complet —zoom cap a la ubicació i
  // marcador destacat— perquè en aquell cas el punt no és visible.
  function seleccionaProduccio(p, opcions) {
    opcions = opcions || {};
    if (!p.ubicacions.length) return;

    if (nomSeleccionat === p.nom) {
      // Un doble clic sobre la mateixa localització genera dos clics
      // seguits (i, si no s'aturés més avall, també el zoom natiu del
      // navegador): el segon clic no s'ha d'interpretar com un clic
      // deliberat per desmarcar, sinó ignorar-se perquè el resultat final
      // sigui idèntic a un sol clic (seleccionat, sense zoom).
      if (Date.now() - momentUltimaSeleccio < FINESTRA_IGNORA_DOBLE_CLIC) return;
      if (seleccioAmbZoom) {
        desfixaProduccio();
      } else {
        netejaSeleccioProduccio();
      }
      return;
    }

    // Mateix motiu que a desfixaProduccio(): tallar en sec qualsevol
    // animació pendent abans de canviar la selecció evita que es barregi
    // amb la que ve tot seguit i que la correcció de maxBounds l'agafi a
    // mig vol.
    map.stop();
    netejaSeleccioProduccio(opcions.origenLlista);

    if (opcions.nomesLlista) {
      nomSeleccionat = p.nom;
      momentUltimaSeleccio = Date.now();
      seleccioAmbZoom = false;
      filaSeleccionadaEl = prodsListEl.querySelector(`.sp-prod-row[data-nom="${CSS.escape(p.nom)}"]`);
      if (filaSeleccionadaEl) {
        filaSeleccionadaEl.classList.add('seleccionada');
        mostraFilaSeleccionada(filaSeleccionadaEl);
      }
      // El punt ja és visible al mapa (dins la comarca expandida): en lloc
      // de crear-hi un marcador destacat a sobre, s'afegeix l'anell polsant
      // directament al seu propi cartellet permanent.
      if (capaPuntsComarca) {
        capaPuntsComarca.eachLayer(marcador => {
          if (marcador._nomProduccio !== p.nom) return;
          const tooltip = marcador.getTooltip();
          const tooltipEl = tooltip && tooltip.getElement();
          if (tooltipEl) tooltipEl.classList.add('punt-produccio-label-seleccionat');
        });
      }
      return;
    }
    seleccioAmbZoom = true;

    // Si hi havia una comarca expandida, la selecció (amb zoom) d'una
    // producció concreta la substitueix (evita mostrar alhora els punts de
    // tota la comarca i el punt destacat de la producció).
    if (capaPuntsComarca) {
      map.removeLayer(capaPuntsComarca);
      capaPuntsComarca = null;
      desressaltaComarca(comarcaExpandida);
      comarcaExpandida = null;
    }

    // L.featureGroup() (no layerGroup): cal getBounds() per ampliar els
    // límits d'arrossegament a actualitzaLimitsSegonsZoom().
    capaSeleccionada = L.featureGroup();
    p.ubicacions.forEach(u => {
      const marcador = L.circleMarker([u.lat, u.lon], {
        pane: 'punts-pane',
        radius: 7,
        color: "#ffffff",
        weight: 2,
        fillColor: "#14120f",
        fillOpacity: 1
      })
        .bindTooltip(etiquetaUbicacio(p, u), {
          direction: 'top',
          offset: [0, -8],
          permanent: true,
          className: 'punt-produccio-label punt-produccio-label-seleccionat'
        })
        // Cal el seu propi listener de clic (el punt destacat no forma
        // part de cap altra capa amb clic ja enganxat): clicar-lo torna a
        // cridar seleccionaProduccio(p), que ja detecta que és la mateixa
        // producció seleccionada i la desmarca.
        .on('click', () => seleccionaProduccio(p))
        // Un doble clic no ha de fer zoom natiu del navegador (vegeu
        // també tooltipEl.ondblclick, més avall).
        .on('dblclick', L.DomEvent.stopPropagation)
        .addTo(capaSeleccionada);
      // Una producció repartida entre comarques té una ubicació (i per tant
      // una comarca a evitar) diferent per a cada marcador, a diferència
      // d'expandeixComarca() on totes en comparteixen una de sola.
      marcador._comarcaNom = u.comarca;
      marcador._direccioForçada = direccioForçada(p, u);
    });
    capaSeleccionada.addTo(map);
    // Una producció amb diverses ubicacions pot tenir-les prou properes
    // perquè els cartellets es tapin entre ells: es reparteixen abans
    // d'obrir-los (dalt/baix/dreta/esquerra segons calgui).
    evitaSolapamentCartellets(capaSeleccionada.getLayers());
    const colorSeleccio = colorFormat(p.format);
    capaSeleccionada.eachLayer(marker => {
      marker.openTooltip();
      // El cartellet és un tooltip de Leaflet (no un element propi): cal
      // fixar-hi el color del format un cop obert, via la variable CSS
      // --label-color que fa servir .punt-produccio-label. getElement()
      // pot retornar undefined si el tooltip encara no s'ha acabat de
      // muntar: sense aquesta comprovació, l'excepció interrompia la
      // resta de la funció (nomSeleccionat mai quedava fixat ni s'arribava
      // al flyTo), deixant punts penjats i el mapa sense tornar mai a la
      // posició inicial en desseleccionar.
      const tooltip = marker.getTooltip();
      const tooltipEl = tooltip && tooltip.getElement();
      if (tooltipEl) {
        tooltipEl.style.setProperty('--label-color', colorSeleccio);
        // Compensa la punxa quan evitaSolapamentCartellets() ha desplaçat
        // aquest cartellet horitzontalment (vegeu la CSS).
        tooltipEl.style.setProperty('--punxa-x', -L.point(tooltip.options.offset).x + 'px');
        // Permanent (mateix motiu que a expandeixComarca): segur reactivar
        // els clics, no es tanca mai sol en passar-hi el ratolí per sobre.
        tooltipEl.style.pointerEvents = 'auto';
        tooltipEl.style.cursor = 'pointer';
        // El cartellet ha de fer la mateixa funció que el punt en
        // clicar-lo (desmarcar la producció, ja que és la seleccionada).
        tooltipEl.onclick = e => { e.stopPropagation(); seleccionaProduccio(p); };
        // Un doble clic no ha de fer zoom natiu del navegador.
        tooltipEl.ondblclick = e => e.stopPropagation();
      }
    });
    nomSeleccionat = p.nom;
    momentUltimaSeleccio = Date.now();

    filaSeleccionadaEl = prodsListEl.querySelector(`.sp-prod-row[data-nom="${CSS.escape(p.nom)}"]`);
    if (filaSeleccionadaEl) {
      filaSeleccionadaEl.classList.add('seleccionada');
      // La fila puja a la posició mig-dalt de la llista només quan la
      // selecció ve del mapa (la fila pot no ser visible en aquell
      // moment): si es clica directament a la llista, es queda seleccionada
      // al lloc on ja era (netejaSeleccioProduccio() ja no toca el scroll
      // en aquest cas, vegeu el seu paràmetre mantenirScroll).
      if (!opcions.origenLlista) {
        mostraFilaSeleccionada(filaSeleccionadaEl);
      }
    }

    // Lleuger zoom cap a la ubicació (o ubicacions) seleccionada: mig punt
    // de zoom per sobre de zoomBase (l'enquadrament inicial), no de
    // map.getZoom() — així seleccionar produccions una darrere l'altra
    // sempre acaba al mateix nivell d'apropament, mai s'acumula.
    const zoomSeleccio = Math.min(zoomBase + 0.5, map.getMaxZoom());
    // duration/easeLinearity allarguen l'animació (per defecte Leaflet la
    // calcula automàticament segons la distància, i sol quedar massa
    // ràpida i sobtada per a un simple lleuger apropament).
    const animacioSeleccio = { duration: 0.7, easeLinearity: 0.2 };
    if (p.ubicacions.length === 1) {
      map.flyTo([p.ubicacions[0].lat, p.ubicacions[0].lon], zoomSeleccio, animacioSeleccio);
    } else {
      const bounds = L.latLngBounds(p.ubicacions.map(u => [u.lat, u.lon]));
      // maxZoom evita que, si les ubicacions són molt properes entre
      // elles, flyToBounds s'acosti massa — com a molt el lleuger zoom
      // de zoomSeleccio, encara que hi hagi espai per apropar-se més.
      map.flyToBounds(bounds, { padding: [60, 60], maxZoom: zoomSeleccio, ...animacioSeleccio });
    }
  }
})();
</script>

</body>
</html>
