<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Ponent i Acció · Produccions audiovisuals per comarca</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<style>
  /* Tipografies autoallotjades (fitxers a fonts/), en lloc de Google Fonts:
     per tornar a la versió anterior (Google Fonts) només cal substituir
     aquest bloc @font-face pels <link> originals:
       <link rel="preconnect" href="https://fonts.googleapis.com">
       <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
       <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
     Els mateixos noms de família ('Outfit' i 'Space Grotesk') fan que la
     resta del CSS no necessiti cap altre canvi. */
  @font-face {
    font-family: 'Outfit';
    src: url('fonts/Outfit-Thin.ttf') format('truetype');
    font-weight: 100;
  }
  @font-face {
    font-family: 'Outfit';
    src: url('fonts/Outfit-ExtraLight.ttf') format('truetype');
    font-weight: 200;
  }
  @font-face {
    font-family: 'Outfit';
    src: url('fonts/Outfit-Light.ttf') format('truetype');
    font-weight: 300;
  }
  @font-face {
    font-family: 'Outfit';
    src: url('fonts/Outfit-Regular.ttf') format('truetype');
    font-weight: 400;
  }
  @font-face {
    font-family: 'Outfit';
    src: url('fonts/Outfit-Medium.ttf') format('truetype');
    font-weight: 500;
  }
  @font-face {
    font-family: 'Outfit';
    src: url('fonts/Outfit-SemiBold.ttf') format('truetype');
    font-weight: 600;
  }
  @font-face {
    font-family: 'Outfit';
    src: url('fonts/Outfit-Bold.ttf') format('truetype');
    font-weight: 700;
  }
  @font-face {
    font-family: 'Outfit';
    src: url('fonts/Outfit-ExtraBold.ttf') format('truetype');
    font-weight: 800;
  }
  @font-face {
    font-family: 'Outfit';
    src: url('fonts/Outfit-Black.ttf') format('truetype');
    font-weight: 900;
  }
  @font-face {
    font-family: 'Space Grotesk';
    src: url('fonts/SpaceGrotesk-Light.ttf') format('truetype');
    font-weight: 300;
  }
  @font-face {
    font-family: 'Space Grotesk';
    src: url('fonts/SpaceGrotesk-Regular.ttf') format('truetype');
    font-weight: 400;
  }
  @font-face {
    font-family: 'Space Grotesk';
    src: url('fonts/SpaceGrotesk-Medium.ttf') format('truetype');
    font-weight: 500;
  }
  @font-face {
    font-family: 'Space Grotesk';
    src: url('fonts/SpaceGrotesk-SemiBold.ttf') format('truetype');
    font-weight: 600;
  }
  @font-face {
    font-family: 'Space Grotesk';
    src: url('fonts/SpaceGrotesk-Bold.ttf') format('truetype');
    font-weight: 700;
  }

  /* Paleta corporativa de Ponent i Acció (guia d'identitat visual,
     actualitzada): --color-clar/--color-mitja són els Pantone oficials
     (156 C, 4675). --color-fosc és una variant reforçada (més saturada i
     fosca) del Pantone 7591 C, perquè l'accent principal de l'app tingui
     més força visual que el to pla original. --color-fosc-text és una
     variant encara més fosca de --color-fosc feta a mà, només per a text
     sobre fons clar; --color-fosc-clar és la inversa (més clara), per a
     text en accent sobre fons foscos (--ink), on --color-fosc pla no dona
     prou contrast. */
  :root{
    --color-clar: #EABE86;
    --color-mitja: #D9C0A9;
    --color-fosc: #B64720;
    --color-fosc-text: #7F3216;
    --color-fosc-clar: #D39179;
    --ink: #14120f;
    --paper: #faf8f4;
    --panel: #F2EDE6;
    font-family: 'Outfit', 'Helvetica Neue', Arial, sans-serif;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: var(--paper);
    color: var(--ink);
  }

  body {
    display: flex;
    flex-direction: column;
  }

  /* Tots els valors de la capçalera que segueixen ("clamp(min, Xvw, max)")
     comparteixen la mateixa proporció de base (referència: pantalla de
     1920px) i els mateixos límits d'escala (entre el 75% i el 140% de la
     mida de referència, és a dir, es mantenen fixos per sota de 1440px i
     per sobre de 2688px). Com que tots creixen/s'aturen exactament al
     mateix punt, mai poden desquadrar-se entre ells (logo, ratlla, marge
     del títol, mides de lletra) encara que la finestra canviï de mida —
     a diferència de l'intent anterior, que barrejava un valor en vw amb
     un altre en px fix i acabaven descoordinats. */
  header {
    background: var(--color-fosc);
    color: var(--panel);
    min-height: clamp(70.5px, 4.8958vw, 131.6px);
    padding: 0 28px;
    box-sizing: border-box;
    border-bottom: 3px solid var(--panel);
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 10px 24px;
    position: relative;
    z-index: 10;
  }

  /* padding-left lligat a la mateixa mida que #side-panel (flex: 0 0 32%,
     min-width 260px, max-width 420px, + 20px de marge): així el títol
     comença sempre a l'alçada d'on acaba el panell de sota, sigui quina
     sigui l'amplada de la finestra. */
  header .title-block {
    position: relative;
    padding-left: clamp(280px, 32vw + 20px, 440px);
  }

  /* El logo es treu del flux (position: absolute) i es centra verticalment
     de manera independent: com que és més alt que el propi capçalera, si
     es deixés dins el flux flexbox arrossegaria el text i la llegenda cap
     al seu propi centre en lloc del centre real del requadre. Amb
     position:absolute, el text i la llegenda es centren només respecte al
     capçalera, i el logo es centra per separat amb el mateix punt mig.
     Alineat amb el marge esquerre del contingut (28px, el mateix que fa
     servir #side-panel per al seu propi text). S'usa la variant
     "transparent" (no la "negatiu", que porta un fons negre opac) i es
     converteix a blanc pla per filtre CSS: brightness(0) converteix
     qualsevol color opac a negre (conservant la transparència), invert(1)
     el passa a blanc. */
  header .brand-logo {
    position: absolute;
    left: 28px;
    top: 50%;
    transform: translateY(-50%);
    height: clamp(94.9px, 6.5885vw, 177.1px);
    width: auto;
    display: block;
    filter: brightness(0) invert(1);
  }

  header .title-text {
    display: flex;
    flex-direction: column;
    gap: 2px;
  }

  /* Ratlla vertical com a marcador decoratiu a l'esquerra del títol,
     centrada exactament sobre la barra de scroll de #side-panel (no
     sobre la seva vora): la vora dreta del panell fa servir els mateixos
     valors clamp que la seva amplada (32%, mín. 260px, màx. 420px), i es
     resta la meitat de --scroll-w (mesurada per JS al principi del bloc
     de codi principal) i la meitat del propi gruix de la ratlla (3px) per
     centrar-la de debò sobre la barra, no sobre la vora del panell. */
  header .title-rule {
    position: absolute;
    left: calc(clamp(260px, 32vw, 420px) - (var(--scroll-w, 15px) / 2) - 1.5px);
    top: 0;
    bottom: 0;
    width: 3px;
    background: var(--panel);
  }

  header h1 {
    margin: 0;
    font-family: 'Outfit', 'Helvetica Neue', Arial, sans-serif;
    font-size: clamp(18.75px, 1.3021vw, 35px);
    font-weight: 500;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--panel);
  }

  #legend-bar {
    display: flex;
    align-items: center;
    gap: clamp(9.4px, 0.651vw, 17.5px);
    font-family: 'Outfit', 'Helvetica Neue', Arial, sans-serif;
    font-size: clamp(10.3px, 0.716vw, 19.25px);
    color: var(--panel);
  }

  #legend-bar .swatches {
    display: flex;
    align-items: center;
    height: clamp(9.4px, 0.651vw, 17.5px);
    border: 1px solid #4a3f38;
  }

  #legend-bar .swatches span {
    width: clamp(15px, 1.0417vw, 28px);
    height: clamp(9.4px, 0.651vw, 17.5px);
    display: block;
  }

  #content-row {
    flex: 1;
    min-height: 0;
    display: flex;
    flex-direction: row;
  }

  /* Panell lateral esquerre: resum institucional per a projecció */
  #side-panel {
    flex: 0 0 32%;
    min-width: 260px;
    max-width: 420px;
    background: #ffffff;
    color: var(--ink);
    display: flex;
    flex-direction: column;
    justify-content: flex-start;
    gap: 6px;
    padding: 32px 28px;
    overflow-y: auto;
  }

  /* Franja de fons més suau que el blanc de la resta del panell, només
     darrere de les xifres globals: les distingeix visualment de la llista
     de sota sense fer servir un requadre (vora arrodonida/ombra). */
  .sp-stats {
    display: flex;
    flex-direction: column;
    gap: 16px;
    background: var(--panel);
    margin: -32px -28px 0;
    padding: 32px 28px 28px;
  }

  .sp-stats-row {
    display: flex;
    gap: 28px;
  }

  .sp-stat-value {
    font-family: 'Space Grotesk', 'Helvetica Neue', Arial, sans-serif;
    font-weight: 700;
    font-size: clamp(32px, 3.6vw, 50px);
    line-height: 1.05;
    color: var(--color-fosc);
    letter-spacing: -0.01em;
  }

  .sp-stat-label {
    font-family: 'Outfit', 'Helvetica Neue', Arial, sans-serif;
    font-size: 10.5px;
    font-weight: 600;
    letter-spacing: 0.13em;
    text-transform: uppercase;
    color: #4a3d30;
    margin-top: 3px;
  }

  .sp-prods-section {
    display: flex;
    flex-direction: column;
  }

  /* Marge negatiu perquè les files toquin banda i banda del panell (fins
     als 28px de padding de #side-panel), amb el mateix padding horitzontal
     restaurat a cada fila perquè el text quedi igual d'alineat que la
     resta del contingut. */
  .sp-prods-list {
    display: flex;
    flex-direction: column;
    margin: 0 -28px;
  }

  .sp-prod-row {
    padding: 11px 28px;
    border-bottom: 1px solid #ddd2c0;
    cursor: pointer;
  }

  .sp-prod-row:last-child {
    border-bottom: none;
  }

  /* Producció seleccionada (clicada des de la llista o des d'un punt del
     mapa): coincideix visualment amb el punt destacat que apareix al mapa.
     La ratlla esquerra de 4px es descompta del padding perquè el text
     mantingui el mateix alineament que a la resta de files. */
  .sp-prod-row.seleccionada {
    background: rgba(182, 71, 32, 0.22);
    padding-left: 24px;
    border-left: 4px solid var(--ink);
  }

  .sp-prod-row.seleccionada .sp-prod-nom {
    color: var(--color-fosc);
    font-weight: 700;
  }

  .sp-prod-top {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 10px;
  }

  .sp-prod-nom {
    font-family: 'Outfit', 'Helvetica Neue', Arial, sans-serif;
    font-size: 13.5px;
    font-weight: 600;
    color: var(--ink);
    line-height: 1.3;
  }

  .sp-prod-impacte {
    font-family: 'Space Grotesk', 'Helvetica Neue', Arial, sans-serif;
    font-size: 13.5px;
    font-weight: 600;
    color: var(--color-fosc);
    white-space: nowrap;
    flex: none;
  }

  .sp-prod-meta {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 10px;
    margin-top: 3px;
  }

  .sp-prod-format {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    font-size: 11.5px;
    font-weight: 500;
    color: #6b5642;
    font-style: italic;
  }

  .sp-format-dot {
    flex: none;
    width: 8px;
    height: 8px;
    border-radius: 1px;
  }

  .sp-prod-comarques {
    font-size: 11.5px;
    font-weight: 500;
    color: #3d332a;
    text-align: right;
  }

  #map-wrap {
    position: relative;
    flex: 1;
    min-height: 0;
    background: #ffffff;
  }

  #map {
    position: absolute;
    inset: 0;
    background: #ffffff;
  }

  .leaflet-container {
    background: #ffffff;
  }

  /* Noms de les comarques d'interès, al mig del polígon: només el text,
     sense cap fons ni cartellet al darrere. */
  .comarca-label {
    background: transparent;
    border: none;
    box-shadow: none;
    font-family: 'Outfit', 'Helvetica Neue', Arial, sans-serif;
    font-weight: 600;
    font-size: 9.5px;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    color: var(--ink);
    text-shadow: none;
    pointer-events: none;
    white-space: nowrap;
  }

  /* Noms de les comarques veïnes, més discrets, només per context */
  .comarca-label-context {
    background: transparent;
    border: none;
    box-shadow: none;
    font-family: 'Outfit', 'Helvetica Neue', Arial, sans-serif;
    font-weight: 500;
    font-size: 7.5px;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    color: #8f8368;
    text-shadow: none;
    pointer-events: none;
    white-space: nowrap;
  }

  .comarca-label::before,
  .comarca-label-context::before {
    display: none;
  }

  /* Cartellet del punt destacat (seleccionat des de la llista o clicant
     un punt del mapa): tooltip permanent, amb el mateix llenguatge visual
     que les etiquetes de comarca. El color de fons ve del color del
     format (--label-color, fixat per JS a cada cartellet en crear-lo);
     --color-fosc és només el valor de reserva si mai no s'establís. */
  .punt-produccio-label {
    background: var(--label-color, var(--color-fosc));
    border: none;
    box-shadow: 0 2px 8px rgba(20,18,15,0.35);
    border-radius: 3px;
    padding: 4px 7px;
    font-family: 'Outfit', 'Helvetica Neue', Arial, sans-serif;
    font-weight: 500;
    font-size: 11.5px;
    color: var(--ink);
    text-shadow: none;
    white-space: nowrap;
    /* pointer-events es reactiva només als cartellets permanents (comarca
       expandida / producció seleccionada) via JS, no aquí globalment: vegeu
       el comentari a dalt de expandeixComarca() sobre per què. */
    pointer-events: none;
  }

  /* Anell fix al voltant del cartellet de la producció seleccionada (des de
     la llista o clicant un punt/cartellet al mapa), perquè es distingeixi
     clarament dels altres cartellets d'una comarca expandida (que
     comparteixen la mateixa classe base .punt-produccio-label). Es manté
     mentre la producció estigui seleccionada, sense animar-se ni desaparèixer
     sol. */
  .punt-produccio-label-seleccionat {
    box-shadow: 0 2px 8px rgba(20,18,15,0.35), 0 0 0 3px var(--ink);
  }

  /* La "punxa" del cartellet ha d'agafar sempre el color del format
     (--label-color), no el blanc per defecte de Leaflet: com que
     evitaSolapamentCartellets() reparteix els cartellets en qualsevol de
     les 4 direccions per no xocar-hi entre ells, calen les 4 (Leaflet
     només pinta un dels 4 costats del triangle segons la direcció). */
  .punt-produccio-label.leaflet-tooltip-top::before {
    border-top-color: var(--label-color, var(--color-fosc)) !important;
  }
  .punt-produccio-label.leaflet-tooltip-bottom::before {
    border-bottom-color: var(--label-color, var(--color-fosc)) !important;
  }
  .punt-produccio-label.leaflet-tooltip-left::before {
    border-left-color: var(--label-color, var(--color-fosc)) !important;
  }
  .punt-produccio-label.leaflet-tooltip-right::before {
    border-right-color: var(--label-color, var(--color-fosc)) !important;
  }
  /* Les variants top/bottom amb desplaçament horitzontal (per no xocar amb
     un altre cartellet, vegeu DIRECCIONS_CARTELLET) mouen tota la capsa
     cap a un costat, però Leaflet sempre centra la punxa respecte la
     capsa: sense compensar-ho, la punxa deixa d'apuntar cap al punt real.
     --punxa-x (fixada en obrir el tooltip, vegeu JS) desplaça la punxa en
     sentit contrari per compensar-ho. */
  .punt-produccio-label.leaflet-tooltip-top::before,
  .punt-produccio-label.leaflet-tooltip-bottom::before {
    left: calc(50% + var(--punxa-x, 0px));
  }

  /* Popup propi (no natiu de Leaflet), fixat respecte la finestra: es
     reposiciona sol per quedar sempre sencer dins la pantalla, sense moure
     mai el mapa. */
  #custom-popup {
    position: fixed;
    z-index: 1000;
    width: 220px;
    display: none;
    background: #fffdf8;
    border-radius: 3px;
    box-shadow: 0 10px 30px rgba(20,18,15,0.3);
    border: 1px solid #ece2d1;
    font-family: 'Outfit', 'Helvetica Neue', Arial, sans-serif;
    pointer-events: none;
  }

  .comarca-popup {
    position: relative;
  }

  .comarca-popup .cp-head {
    background: var(--ink);
    color: var(--panel);
    padding: 9px 12px 7px;
    border-top: 3px solid var(--color-fosc);
  }

  .comarca-popup .cp-head h2 {
    margin: 0 0 4px;
    font-family: 'Space Grotesk', 'Helvetica Neue', Arial, sans-serif;
    font-size: 15px;
    font-weight: 600;
    letter-spacing: 0.005em;
  }

  .comarca-popup .cp-stats {
    display: flex;
    gap: 10px;
    font-size: 10.5px;
    font-weight: 500;
    color: #c9bda8;
  }

  .comarca-popup .cp-stats b {
    color: var(--color-fosc-clar);
    font-size: 12px;
    display: block;
    font-family: 'Space Grotesk', 'Helvetica Neue', Arial, sans-serif;
    font-weight: 600;
  }

  .comarca-popup .cp-body {
    padding: 7px 12px 10px;
  }

  .comarca-popup .cp-empty {
    font-size: 11.5px;
    color: #6f6555;
    font-style: italic;
    padding: 5px 0 2px;
  }

  .comarca-popup .cp-item {
    padding: 6px 0;
    border-bottom: 1px solid #efe6d6;
  }

  .comarca-popup .cp-item:last-child {
    border-bottom: none;
  }

  .comarca-popup .cp-item .cp-nom {
    font-size: 11.5px;
    font-weight: 600;
    color: var(--ink);
    line-height: 1.25;
  }

  .comarca-popup .cp-item .cp-meta {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-top: 2px;
  }

  .comarca-popup .cp-item .cp-format {
    font-size: 10px;
    color: #5c5346;
    font-style: italic;
  }

  .comarca-popup .cp-item .cp-impacte {
    font-size: 10.5px;
    color: var(--color-fosc-text);
    font-weight: 600;
    white-space: nowrap;
    margin-left: 8px;
  }

  #tooltip-hint {
    position: absolute;
    bottom: 14px;
    right: 14px;
    z-index: 500;
    background: rgba(20,18,15,0.9);
    color: #f0e6d2;
    font-family: 'Outfit', 'Helvetica Neue', Arial, sans-serif;
    font-size: 9.5px;
    padding: 5px 9px;
    border-radius: 3px;
    letter-spacing: 0.01em;
    pointer-events: none;
  }

  /* Buit per defecte (el text estàtic s'ha tret): només s'omple, i per
     tant només es veu, quan hi ha un avís real (p. ex. dades no
     carregades). :empty l'amaga sencer mentre no hi hagi res a dir. */
  #source-note {
    position: absolute;
    bottom: 46px;
    right: 14px;
    z-index: 500;
    font-family: 'Outfit', 'Helvetica Neue', Arial, sans-serif;
    font-size: 10px;
    color: #5c5346;
    background: rgba(250,248,244,0.88);
    padding: 4px 8px;
    border-radius: 3px;
  }

  #source-note:empty {
    display: none;
  }

</style>
</head>
<body>

<header>
  <img class="brand-logo" src="img/logo-ponent-i-accio-transparent.png" alt="Ponent i Acció · Un horitzó per explorar">
  <div class="title-block">
    <div class="title-text">
      <h1>Produccions audiovisuals per comarca</h1>
    </div>
  </div>
  <div class="title-rule"></div>
  <div id="legend-bar">
    <span>0 produccions</span>
    <div class="swatches" id="legend-swatches"></div>
    <span>8 produccions</span>
  </div>
</header>

<div id="content-row">
  <aside id="side-panel">
    <div class="sp-stats">
      <div class="sp-stats-row">
        <div>
          <div class="sp-stat-value" id="stat-total-produccions">—</div>
          <div class="sp-stat-label">produccions</div>
        </div>
        <div>
          <div class="sp-stat-value" id="stat-total-localitzacions">—</div>
          <div class="sp-stat-label">localitzacions</div>
        </div>
      </div>
      <div>
        <div class="sp-stat-value" id="stat-total-impacte">—</div>
        <div class="sp-stat-label">impacte econòmic</div>
      </div>
    </div>

    <div class="sp-prods-section">
      <div class="sp-prods-list" id="prods-list"></div>
    </div>
  </aside>

  <div id="map-wrap">
    <div id="map"></div>
    <div id="tooltip-hint">Passa el ratolí o toca una comarca acolorida per veure el detall de produccions</div>
    <div id="source-note"></div>
  </div>
</div>

<script>
(async function () {
  // Mesura l'amplada real de la barra de scroll del navegador (varia
  // segons SO/navegador, i és 0 en alguns amb overlay): un div temporal
  // amb overflow:scroll força que la barra hi aparegui sempre, sense
  // dependre que #side-panel tingui prou contingut per desbordar en
  // aquest moment. --scroll-w l'usa header .title-rule per centrar-se
  // exactament sobre la barra de scroll del panell, no sobre la seva
  // vora.
  (function mesuraAmpladaScroll() {
    const div = document.createElement('div');
    div.style.cssText = 'position:absolute; top:-9999px; left:-9999px; width:100px; height:100px; overflow:scroll;';
    document.body.appendChild(div);
    const amplada = div.offsetWidth - div.clientWidth;
    document.body.removeChild(div);
    document.documentElement.style.setProperty('--scroll-w', amplada + 'px');
  })();

  // ============================================================
  // DADES DE NEGOCI — produccions per comarca
  // Es carreguen en viu des d'un Google Sheet publicat com a CSV
  // (Arxiu > Comparteix > Publica al web > CSV, amb "Publicar
  // automàticament quan es facin canvis" activat). Els caps de
  // Ponent i Acció actualitzen el full de càlcul i el mapa reflecteix
  // els canvis en recarregar la pàgina — no cal tocar aquest fitxer.
  // ============================================================
  const DADES_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vTXkr1O6s_UH78jp-4Xi5WaekEHH1IUWQ7ztLklJouoTqrEKhxB9-uDmgTYg6Yj8tuCQLsmocD9cqIT/pub?gid=639152892&single=true&output=csv";

  // Comarques d'estudi (fixes): sempre es mostren al mapa, encara que
  // el full no tingui cap fila per a alguna d'elles (p. ex. Garrigues,
  // sense produccions registrades avui).
  const TARGET_COMARQUES = ["Garrigues", "Noguera", "Pla d'Urgell", "Segarra", "Segrià", "Urgell"];

  // Parser CSV mínim: gestiona camps entre cometes amb comes o salts de
  // línia interns, tal com exporta Google Sheets (p. ex. "PIM, PAM, PUM").
  function parseCsv(text) {
    const rows = [];
    let row = [], field = "", inQuotes = false;
    for (let i = 0; i < text.length; i++) {
      const char = text[i];
      if (inQuotes) {
        if (char === '"') {
          if (text[i + 1] === '"') { field += '"'; i++; }
          else { inQuotes = false; }
        } else {
          field += char;
        }
      } else if (char === '"') {
        inQuotes = true;
      } else if (char === ',') {
        row.push(field);
        field = "";
      } else if (char === '\n' || char === '\r') {
        if (char === '\r' && text[i + 1] === '\n') i++;
        row.push(field);
        rows.push(row);
        row = [];
        field = "";
      } else {
        field += char;
      }
    }
    if (field !== "" || row.length) {
      row.push(field);
      rows.push(row);
    }
    return rows.filter(r => r.some(f => f.trim() !== ""));
  }

  // Google publica els imports amb "." com a separador de milers (format
  // català/espanyol, p. ex. "13.333"); els traiem abans de convertir a
  // número i tractem una possible "," com a separador decimal.
  function parseImpacte(str) {
    if (!str) return 0;
    const net = str.trim().replace(/\./g, "").replace(",", ".");
    const n = parseFloat(net);
    return isNaN(n) ? 0 : n;
  }

  async function carregaComarques() {
    const cacheBust = (DADES_CSV_URL.includes("?") ? "&" : "?") + "cb=" + Date.now();
    const resposta = await fetch(DADES_CSV_URL + cacheBust);
    if (!resposta.ok) throw new Error("No s'ha pogut descarregar el full de dades (" + resposta.status + ")");
    const files = parseCsv(await resposta.text());

    const filaCapcalera = files.findIndex(f => (f[0] || "").trim().toLowerCase() === "comarca");
    if (filaCapcalera === -1) throw new Error("No s'ha trobat la fila de capçaleres al full");

    const capcaleres = files[filaCapcalera].map(h => h.trim().toLowerCase());
    const colComarca = capcaleres.indexOf("comarca");
    const colNom = capcaleres.findIndex(h => h.startsWith("nom"));
    const colFormat = capcaleres.findIndex(h => h.startsWith("format"));
    const colImpacte = capcaleres.findIndex(h => h.startsWith("impacte"));
    const colLatitud = capcaleres.findIndex(h => h.startsWith("lat"));
    const colLongitud = capcaleres.findIndex(h => h.startsWith("long"));
    const colMunicipi = capcaleres.findIndex(h => h.startsWith("municipi"));

    // Latitud/Longitud del rodatge (columnes opcionals): si no hi són, o
    // estan buides per a una fila, la producció simplement no té punt al
    // mapa — no és un error, moltes files encara no les tindran omplertes.
    function parseCoordenada(str) {
      if (!str) return NaN;
      return parseFloat(str.trim().replace(",", "."));
    }

    const produccionsPerComarca = {};
    files.slice(filaCapcalera + 1).forEach(fila => {
      const nomComarca = (fila[colComarca] || "").trim();
      const nomProjecte = (fila[colNom] || "").trim();
      if (!nomComarca || !nomProjecte) return; // fila buida, fila de TOTALS, etc.
      const produccio = {
        nom: nomProjecte,
        format: (fila[colFormat] || "").trim(),
        impacte: parseImpacte(fila[colImpacte]),
        lat: colLatitud !== -1 ? parseCoordenada(fila[colLatitud]) : NaN,
        lon: colLongitud !== -1 ? parseCoordenada(fila[colLongitud]) : NaN,
        municipi: colMunicipi !== -1 ? (fila[colMunicipi] || "").trim() : ""
      };
      (produccionsPerComarca[nomComarca] = produccionsPerComarca[nomComarca] || []).push(produccio);
    });

    return TARGET_COMARQUES.map(nom => ({
      nom,
      produccions: produccionsPerComarca[nom] || []
    }));
  }

  let comarques;
  try {
    comarques = await carregaComarques();
  } catch (err) {
    console.error("No s'han pogut carregar les dades del full de Google:", err);
    // Mode de seguretat: es mostra el mapa buit (0 produccions) en lloc
    // de trencar la pàgina, pensat per a pantalles de projecció permanent.
    comarques = TARGET_COMARQUES.map(nom => ({ nom, produccions: [] }));
    document.getElementById('source-note').textContent = "No s'han pogut carregar les dades més recents";
  }

  // Deriva numProduccions i totalImpacte a partir de produccions[], en
  // lloc de mantenir-los escrits a mà: així sempre queden consistents
  // amb la llista real, encara que aquesta canviï.
  comarques.forEach(c => {
    c.numProduccions = c.produccions.length;
    c.totalImpacte = c.produccions.reduce((sum, p) => sum + p.impacte, 0);
  });

  // ============================================================
  // PANELL LATERAL — resum global (calculat, no escrit a mà)
  // Tot es deriva de comarques[].produccions[]; quan la font de dades
  // canviï (Excel), aquests càlculs seguiran funcionant sense tocar-los.
  // ============================================================
  const totesLesProduccions = comarques.flatMap(c => c.produccions);

  // Una mateixa producció pot repartir-se entre diverses comarques (una
  // fila per comarca al full, cadascuna amb el seu import territorial).
  // Als totals globals i a la classificació per tipus, cada producció
  // només ha de comptar un cop — identificada pel nom (`Nom del
  // projecte`) — encara que aparegui repartida en diverses files. Els
  // totals per comarca no es toquen: allà cada fila ja només compta
  // dins la seva pròpia comarca, com fins ara.
  const produccionsUniques = [];
  const nomsVistos = new Set();
  totesLesProduccions.forEach(p => {
    if (!nomsVistos.has(p.nom)) {
      nomsVistos.add(p.nom);
      produccionsUniques.push(p);
    }
  });

  const totalProduccions = produccionsUniques.length;
  const totalImpacteGlobal = totesLesProduccions.reduce((sum, p) => sum + p.impacte, 0);
  // Cada fila amb Latitud/Longitud vàlides és una ubicació (un punt al
  // mapa); una mateixa producció pot aportar-ne diverses si es reparteix
  // entre comarques, per això es compten les files, no les produccions.
  const totalLocalitzacions = totesLesProduccions.filter(p => isFinite(p.lat) && isFinite(p.lon)).length;

  document.getElementById('stat-total-produccions').textContent = totalProduccions;
  document.getElementById('stat-total-localitzacions').textContent = totalLocalitzacions;
  document.getElementById('stat-total-impacte').textContent = formatEuros(totalImpacteGlobal);

  // Desglossament complet: una producció pot repartir-se entre diverses
  // comarques (una fila per comarca al full); aquí es fusionen en una sola
  // entrada (nom + totes les comarques on apareix + import sumat), sense
  // agrupar-les per tipus, i ordenades de més a menys import.
  const produccionsPerNom = new Map();
  comarques.forEach(c => {
    c.produccions.forEach(p => {
      if (!produccionsPerNom.has(p.nom)) {
        produccionsPerNom.set(p.nom, { nom: p.nom, format: p.format, impacte: 0, comarques: [], ubicacions: [] });
      }
      const entrada = produccionsPerNom.get(p.nom);
      entrada.impacte += p.impacte;
      entrada.comarques.push(c.nom);
      // Una producció repartida entre diverses comarques pot tenir un
      // rodatge a cadascuna: es guarda una ubicació per cada fila que
      // tingui coordenades vàlides (no només la primera), perquè en
      // seleccionar-la des de la llista apareguin totes al mapa alhora.
      if (isFinite(p.lat) && isFinite(p.lon)) {
        entrada.ubicacions.push({ comarca: c.nom, municipi: p.municipi, lat: p.lat, lon: p.lon });
      }
    });
  });
  const produccionsOrdenades = [...produccionsPerNom.values()].sort((a, b) => b.impacte - a.impacte);

  // Color per tipus de format (Curtmetratge, Llargmetratge, Sèrie, Spot,
  // Videoclip, Reportatge...). El text ve escrit a mà al full ("Curtmetratge
  // acadèmic", "Curtmetratge documental", etc.), per això es classifica
  // buscant la paraula clau del format base dins el text, en lloc de
  // comparar-lo sencer — així "Curtmetratge acadèmic" i "Curtmetratge
  // documental" comparteixen el mateix color que "Curtmetratge".
  // Tons clars (pastel): amb els originals més foscos (p. ex. el vermell
  // fosc de Llargmetratge, #7a1e26), el text fosc dels cartellets i de la
  // llista quedava massa poc llegible a sobre.
  const FORMAT_COLORS = [
    { keyword: "llargmetratge", color: "#e0917d", label: "Llargmetratge" },
    { keyword: "curtmetratge", color: "#fbd08a", label: "Curtmetratge" },
    { keyword: "sèrie", color: "#fdb0b5", label: "Sèrie" },
    { keyword: "spot", color: "#9ec9d4", label: "Spot" },
    { keyword: "videoclip", color: "#c6b3dc", label: "Videoclip" },
    { keyword: "reportatge", color: "#a9cea4", label: "Reportatge" }
  ];
  const FORMAT_COLOR_DEFAULT = "#c4bbae";
  function colorFormat(format) {
    const f = (format || "").toLowerCase();
    const match = FORMAT_COLORS.find(fc => f.includes(fc.keyword));
    return match ? match.color : FORMAT_COLOR_DEFAULT;
  }

  // files.dataset.nom permet retrobar la fila d'una producció des del
  // mapa (en clicar un punt) per marcar-la com a seleccionada, sense
  // haver de mantenir una segona llista paral·lela d'elements.
  const prodsListEl = document.getElementById('prods-list');
  produccionsOrdenades.forEach(p => {
    const row = document.createElement('div');
    row.className = 'sp-prod-row';
    row.dataset.nom = p.nom;
    row.innerHTML = `
      <div class="sp-prod-top">
        <span class="sp-prod-nom">${p.nom}</span>
        <span class="sp-prod-impacte">${formatEuros(p.impacte)}</span>
      </div>
      <div class="sp-prod-meta">
        <span class="sp-prod-format"><span class="sp-format-dot" style="background:${colorFormat(p.format)}"></span>${p.format}</span>
        <span class="sp-prod-comarques">${p.comarques.join(", ")}</span>
      </div>
    `;
    // seleccionaProduccio() es defineix més avall (un cop el mapa ja
    // existeix), però com és una "function" normal queda hoisted i es pot
    // fer servir aquí sense problemes: en el moment del clic ja estarà
    // definida.
    row.addEventListener('click', () => seleccionaProduccio(p, { origenLlista: true }));
    prodsListEl.appendChild(row);
  });

  // ============================================================
  // GEOMETRIA — fronteres de comarques i de Catalunya
  // Es carrega en viu des dels fitxers .geojson del projecte (font real,
  // sense duplicar-los a mà). No prové ni provindrà de la font de dades
  // de produccions: és independent, i es manté separada de la secció
  // anterior.
  // ============================================================

  // Comarques veïnes de Tarragona i Barcelona que fan frontera directa amb
  // la zona d'interès, incloses només com a context (sense dades pròpies).
  const CONTEXT_COMARQUES = ["Anoia", "Conca de Barberà", "Priorat", "Ribera d'Ebre"];

  async function carregaGeoJSON(url) {
    const resposta = await fetch(url);
    if (!resposta.ok) throw new Error("No s'ha pogut descarregar " + url + " (" + resposta.status + ")");
    return resposta.json();
  }

  // Algunes comarques venen partides en diverses entrades al fitxer font
  // (p. ex. Pla d'Urgell). Es fusionen en una sola Feature per comarca,
  // perquè el codi de sota només posa una etiqueta i un popup per Feature.
  function fusionaPerComarca(features) {
    const grups = {};
    features.forEach(f => {
      const nom = f.properties.nom_comar;
      (grups[nom] = grups[nom] || []).push(f);
    });
    return Object.entries(grups).map(([nom, feats]) => ({
      type: "Feature",
      properties: {
        nom,
        target: TARGET_COMARQUES.includes(nom)
      },
      geometry: {
        type: "MultiPolygon",
        coordinates: [].concat(...feats.map(f => f.geometry.coordinates))
      }
    }));
  }

  async function carregaGeometria() {
    const [lleida, tarragona, barcelona, girona, catalunyaGeoJSON, espanya] = await Promise.all([
      carregaGeoJSON("comarques-lleida.geojson"),
      carregaGeoJSON("comarques-tarragona.geojson"),
      carregaGeoJSON("comarques-barcelona.geojson"),
      carregaGeoJSON("comarques-girona.geojson"),
      carregaGeoJSON("catalunya.geojson"),
      carregaGeoJSON("comunidades_autonomas_df2023_con_geometry.geojson")
    ]);

    const comarquesContext = [...tarragona.features, ...barcelona.features]
      .filter(f => CONTEXT_COMARQUES.includes(f.properties.nom_comar));

    const comarquesGeoJSON = {
      type: "FeatureCollection",
      features: fusionaPerComarca([...lleida.features, ...comarquesContext])
    };

    // Context cartogràfic més enllà de les 16 comarques: la resta de
    // comarques de Barcelona, Tarragona i Girona (Lleida ja hi és sencera).
    // També es fusionen les que venen partides (Cerdanya, Ripollès,
    // Barcelonès, Berguedà), perquè cadascuna tingui una sola etiqueta.
    const contextExteriorGeoJSON = {
      type: "FeatureCollection",
      features: fusionaPerComarca(
        [...tarragona.features, ...barcelona.features, ...girona.features]
          .filter(f => !CONTEXT_COMARQUES.includes(f.properties.nom_comar))
      )
    };

    // Àrea d'Espanya (resta de comunitats autònomes), com a fons de
    // context més enllà de Catalunya. Canàries queda fora de l'abast
    // visible del mapa i no s'inclou.
    const espanyaGeoJSON = {
      type: "FeatureCollection",
      features: espanya.features.filter(f =>
        f.properties.ccaa !== "Cataluña" && f.properties.ccaa !== "Canarias")
    };

    return { comarquesGeoJSON, catalunyaGeoJSON, contextExteriorGeoJSON, espanyaGeoJSON };
  }

  let comarquesGeoJSON, catalunyaGeoJSON, contextExteriorGeoJSON, espanyaGeoJSON;
  try {
    ({ comarquesGeoJSON, catalunyaGeoJSON, contextExteriorGeoJSON, espanyaGeoJSON } = await carregaGeometria());
  } catch (err) {
    console.error("No s'ha pogut carregar la geometria de les comarques:", err);
    document.getElementById('map').innerHTML =
      '<div style="padding:24px;font-family:Outfit,Arial,sans-serif;color:#7a1e26;">No es pot carregar el mapa de comarques.</div>';
    return;
  }

  const comarquesByName = {};
  // trim() com a xarxa de seguretat davant de possibles espais sobrants
  // en els noms de comarca quan aquests vinguin d'una font externa.
  comarques.forEach(c => { comarquesByName[c.nom.trim()] = c; });

  // Degradat de comarques segons nombre de produccions: blanc (cap) i vuit
  // graons que van d'ivori clar fins a prop de l'accent terracota de la
  // resta de l'app (--color-fosc, #B64720), aclarits un 20% respecte al
  // to pur perquè el contrast entre graons sigui una mica més suau.
  const palette = ["#ffffff","#F8F7F5","#EDE8E1","#E4D8CB","#DDC6B2","#D9B397","#D79C79","#D78159","#C56C4D"];
  function colorFor(count) {
    return palette[Math.min(count, palette.length - 1)];
  }

  function formatEuros(n) {
    return n.toLocaleString("ca-ES") + " €";
  }

  // ---- Popup personalitzat: es reposiciona sol per quedar sempre sencer
  // dins la pantalla (al costat del cursor, girant de banda si cal), sense
  // moure mai el mapa. Només com a últim recurs (llista extremadament
  // llarga en una pantalla molt petita) hi afegim scroll intern.
  const popupEl = document.createElement('div');
  popupEl.id = 'custom-popup';
  document.body.appendChild(popupEl);
  const mapWrapEl = document.getElementById('map-wrap');

  // ---- Expandir una comarca en fer-hi clic ----
  // En lloc de fixar el popup (com abans), un clic sobre una comarca hi fa
  // un petit zoom i en desplega els punts de rodatge de les produccions
  // d'aquesta comarca.
  // Prova d'usabilitat (25/08/2026): la usuària esperava exactament
  // això — que clicant una comarca es veiessin les seves produccions —
  // en lloc de la llista fixa amb botó de tancar que hi havia abans.
  // Funciona com una casella de selecció: clicar la comarca ja expandida
  // la plega; clicar-ne una altra la substitueix.
  let comarcaExpandida = null; // nom
  let capaPuntsComarca = null;
  // Capa (polígon) de cada comarca, indexada pel nom: cal per poder
  // desressaltar la comarca anterior en expandeixComarca() quan se'n
  // clica una altra directament, sense passar per plegaComarca().
  const capaPerComarca = {};
  // Anell de resseguit dibuixat per sobre del contorn exterior vermell
  // (vegeu el comentari de 'ressalt-pane'), per a la comarca actualment
  // ressaltada (hover o expandida). Només n'hi ha un alhora.
  let capaRessalt = null;
  let capaRessaltNom = null;
  // Mentre el mapa torna cap a la posició inicial en plegar una comarca
  // (plegaComarca), es manté a true fins que el flyTo hi arriba de debò
  // (moveend): el hover d'altres comarques queda desactivat durant aquest
  // instant, perquè no aparegui el popup enmig del zoom out.
  let plegantComarca = false;

  // Un clic natiu del navegador es dispara en soltar el botó sobre el
  // mateix element on s'ha premut, encara que pel mig hi hagi hagut un
  // arrossegament llarg — Leaflet ho gestiona internament per al seu
  // propi dragging, però el nostre listener de 'click' a cada comarca no
  // en sap res, així que arrossegar per dins una comarca expandida (que
  // pot ocupar tota la pantalla) es prenia per un clic i la plegava. Es
  // marca quan un arrossegament real acaba de succeir, durant un instant
  // (fins al següent tick) perquè el 'click' que ve immediatament després
  // el pugui detectar i ignorar-lo.
  // (el listener 'dragend' es registra més avall, a prop de 'zoomend')
  let acabaDArrossegar = false;

  // Dibuixa l'anell de resseguit (vegeu 'ressalt-pane') seguint la
  // geometria exacta de la comarca donada, per sobre del contorn
  // exterior vermell: sense això, a les comarques que toquen la vora de
  // la zona el vermell tapava part del seu propi resseguit.
  function ressaltaComarca(nom, layer) {
    if (capaRessalt) map.removeLayer(capaRessalt);
    capaRessalt = L.polygon(layer.getLatLngs(), {
      pane: 'ressalt-pane',
      color: '#14120f',
      weight: 2,
      fill: false,
      interactive: false
    }).addTo(map);
    capaRessaltNom = nom;
  }

  // Treu l'anell de resseguit, però només si encara és el d'aquesta
  // comarca (evita esborrar el d'una altra si el 'mouseover' ja l'ha
  // substituït abans que arribés aquest 'mouseout').
  function treuRessalt(nom) {
    if (capaRessalt && capaRessaltNom === nom) {
      map.removeLayer(capaRessalt);
      capaRessalt = null;
      capaRessaltNom = null;
    }
  }

  // Torna la comarca (per nom) al seu estil normal, sense esperar el
  // 'mouseout' natural: cal cridar-ho explícitament a tots els llocs que
  // deixen de considerar-la "expandida" (plegaComarca, el botó "veure
  // totes", seleccionar una producció...), ja que el 'mouseout' només
  // reposa l'estil quan comarcaExpandida ja no hi apunta (vegeu el
  // comentari del 'mouseout' del polígon) — si el canvi ve d'un altre
  // lloc que no sigui passar-hi el ratolí per sobre, ningú més ho fa.
  function desressaltaComarca(nom) {
    const capa = capaPerComarca[nom];
    const dades = comarquesByName[nom];
    if (capa && dades) capa.setStyle(targetStyle(dades));
    treuRessalt(nom);
  }

  function plegaComarca() {
    if (!capaPuntsComarca) return;
    // Atura qualsevol animació flyTo/flyToBounds encara en curs abans de
    // llançar-ne una de nova: si es deixa en marxa, la correcció de
    // maxBounds xoca amb els fotogrames pendents del flyTo anterior — és
    // el que feia que els punts "es buguegessin" en clicar/desclicar
    // comarques ràpidament. NO es crida actualitzaLimitsSegonsZoom() abans
    // del flyTo (cridar setMaxBounds() amb la vista encara zoomejada feia
    // saltar el mapa de cop a un lloc equivocat abans de començar
    // l'animació) — es deixa que ho faci el listener de 'zoomend' un cop
    // el flyTo hagi arribat de debò al zoom mínim final.
    map.stop();
    map.removeLayer(capaPuntsComarca);
    capaPuntsComarca = null;
    desressaltaComarca(comarcaExpandida);
    comarcaExpandida = null;
    plegantComarca = true;
    map.once('moveend', () => { plegantComarca = false; });
    map.flyTo(targetBounds.getCenter(), zoomBase, { duration: 0.7, easeLinearity: 0.2 });
  }

  function expandeixComarca(c, layer) {
    // Si l'usuari clica una comarca mentre encara s'estava fent el zoom
    // out d'haver-ne plegat una altra, aquest nou clic ja porta la seva
    // pròpia animació: no cal seguir esperant l'anterior.
    plegantComarca = false;
    if (comarcaExpandida === c.nom) {
      plegaComarca();
      return;
    }
    map.stop();
    if (capaPuntsComarca) map.removeLayer(capaPuntsComarca);
    // Si hi havia una altra comarca expandida, es desressegueix (el seu
    // 'mouseout' no ho fa mai sol: mentre comarcaExpandida hi apuntava,
    // es considerava expressament ressaltada, vegeu el comentari del
    // 'mouseout' més amunt). La nova es resseguix de seguida, sense
    // esperar el 'mouseover': si l'usuari ha clicat venint d'una altra
    // comarca ja expandida, el 'mouseover' d'aquesta no arriba a activar
    // el ressalt perquè encara hi havia l'anterior com a expandida.
    if (comarcaExpandida && comarcaExpandida !== c.nom) desressaltaComarca(comarcaExpandida);
    comarcaExpandida = c.nom;
    layer.setStyle(targetHoverStyle(c));
    ressaltaComarca(c.nom, layer);
    // El popup de hover d'aquesta mateixa comarca pot seguir obert just
    // en clicar (el ratolí encara hi és a sobre, així que no arriba mai un
    // 'mouseout' que el tanqui): es tanca explícitament perquè no quedi
    // penjat mentre dura el zoom cap a la comarca.
    hideCustomPopup();

    capaPuntsComarca = L.featureGroup();
    const marcadors = [];
    produccionsOrdenades.forEach(p => {
      const colorPunt = colorFormat(p.format);
      p.ubicacions.filter(u => u.comarca === c.nom).forEach(u => {
        const marcador = L.circleMarker([u.lat, u.lon], {
          pane: 'punts-pane',
          radius: 6,
          color: "#ffffff",
          weight: 1.5,
          fillColor: "#14120f",
          // Invisible d'entrada (opacity/fillOpacity 0): igual que els
          // cartellets, el punt tampoc s'ha de veure aparèixer enmig de
          // l'animació de zoom, sinó tot de cop quan arribi a 'moveend'
          // (vegeu més avall, on es restauren a 1).
          opacity: 0,
          fillOpacity: 0
        })
          // No permanent a l'inici (s'obre sol si el marcador ja és al
          // mapa): es vol que els cartellets apareguin junts un cop el
          // zoom ha arribat de debò, no enmig de l'animació.
          .bindTooltip(etiquetaUbicacio(p, u), {
            direction: 'top',
            offset: [0, -6],
            className: 'punt-produccio-label'
          })
          .on('tooltipopen', function () {
            const tooltip = this.getTooltip();
            const tooltipEl = tooltip.getElement();
            tooltipEl.style.setProperty('--label-color', colorPunt);
            // Compensa la punxa quan evitaSolapamentCartellets() ha
            // desplaçat aquest cartellet horitzontalment (vegeu la CSS).
            tooltipEl.style.setProperty('--punxa-x', -L.point(tooltip.options.offset).x + 'px');
            // Aquest cartellet és permanent (no es tanca mai en treure el
            // ratolí de sobre), així que reactivar-hi els clics és segur:
            // no hi ha risc que es "robi" el hover al punt i es tanqui sol.
            tooltipEl.style.pointerEvents = 'auto';
            tooltipEl.style.cursor = 'pointer';
            // El cartellet ha de fer la mateixa funció que el punt en
            // clicar-lo: reassignar onclick (no addEventListener) evita
            // acumular listeners si el tooltip es torna a obrir.
            tooltipEl.onclick = e => { e.stopPropagation(); seleccionaProduccio(p, { nomesLlista: true }); };
            // Un doble clic no ha de fer zoom natiu del navegador: aturar
            // la propagació abans que arribi al mapa (vegeu també el
            // marcador, més avall).
            tooltipEl.ondblclick = e => e.stopPropagation();
          })
          .on('click', () => seleccionaProduccio(p, { nomesLlista: true }))
          .on('dblclick', L.DomEvent.stopPropagation)
          .addTo(capaPuntsComarca);
        // Comarca a evitar en repartir els cartellets (evitaSolapamentCartellets):
        // aquí sempre és la mateixa, ja que tots els punts d'aquesta capa
        // pertanyen a la comarca expandida.
        marcador._comarcaNom = c.nom;
        marcador._direccioForçada = direccioForçada(p, u);
        // Permet retrobar el marcador des de seleccionaProduccio() quan es
        // clica el seu propi cartellet (opcions.nomesLlista), per afegir-hi
        // l'anell polsant de selecció (vegeu punt-seleccio-polsa a la CSS).
        marcador._nomProduccio = p.nom;
        marcadors.push(marcador);
      });
    });
    capaPuntsComarca.addTo(map);
    actualitzaLimitsSegonsZoom();

    // Es registra ABANS de llançar el flyToBounds (no després): si mai
    // arribés a resoldre's de manera síncrona, cal que el listener ja hi
    // sigui per no perdre l'esdeveniment. Un cop el flyToBounds ha
    // arribat de debò (moveend), es despleguen alhora els cartellets de
    // totes les produccions de la comarca. Es comprova que encara sigui
    // LA MATEIXA comarca expandida per si l'usuari l'ha plegada o n'ha
    // triat una altra mentre volava.
    map.once('moveend', () => {
      if (comarcaExpandida !== c.nom) return;
      marcadors.forEach(marcador => {
        const tooltip = marcador.getTooltip();
        if (!tooltip) return;
        // NO n'hi ha prou amb mutar tooltip.options.permanent: Leaflet
        // només decideix si enganxa els listeners mouseover/mouseout/click
        // al marcador UN COP, en fer-hi bindTooltip() (a dalt, sense
        // 'permanent' perquè encara no ho havia de ser). Un cop enganxats,
        // mutar 'permanent' després no els treu, així que el mouseout
        // seguia tancant el cartellet en passar-hi el ratolí per sobre tot
        // i marcar-lo com a permanent. Cal refer el bindTooltip ja amb
        // permanent:true perquè Leaflet no hi enganxi mai aquests listeners.
        marcador.unbindTooltip();
        marcador.bindTooltip(tooltip.getContent(), {
          direction: 'top',
          offset: [0, -6],
          className: 'punt-produccio-label',
          permanent: true
        });
      });
      evitaSolapamentCartellets(marcadors);
      marcadors.forEach(marcador => {
        marcador.setStyle({ opacity: 1, fillOpacity: 1 });
        marcador.openTooltip();
      });
    });

    // Zoom petit i suau (una mica més lent que el de seleccionar una
    // producció): prou per distingir la comarca sense allunyar-se massa
    // de la resta.
    map.flyToBounds(layer.getBounds(), {
      padding: [40, 40],
      maxZoom: Math.min(zoomBase + 1, map.getMaxZoom()),
      duration: 0.8,
      easeLinearity: 0.15
    });
  }

  document.addEventListener('click', e => {
    if (!comarcaExpandida) return;
    // Un clic que ve just després d'arrossegar el mapa (per exemple,
    // arrossegant des del fons de la pròpia comarca expandida, no des d'un
    // punt) no l'ha de plegar: el navegador encara dispara un 'click'
    // natiu en soltar el botó, encara que pel mig hi hagi hagut un
    // arrossegament llarg. Mateix flag que ja evita el mateix problema al
    // 'click' de la comarca (més avall).
    if (acabaDArrossegar) return;
    if (popupEl.contains(e.target)) return;
    // Un clic sobre un dels punts (o el seu cartellet) de la pròpia
    // comarca expandida no l'ha de plegar — ho gestiona directament
    // seleccionaProduccio(). L.DomEvent.stopPropagation() al listener de
    // clic del marcador NO evita que aquest clic natiu de la SVG arribi
    // igualment fins al document (provat: Leaflet no el bloqueja del tot
    // aquí), així que es comprova explícitament l'origen del clic en lloc
    // de confiar en aturar-ne la propagació.
    if (e.target.closest('.leaflet-punts-pane-pane, .punt-produccio-label')) return;
    plegaComarca();
  });

  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') plegaComarca();
  });

  // Costat (esquerra/dreta del cursor) on s'obre el popup: es decideix una
  // única vegada per comarca i es guarda en aquest mapa — totes les
  // vegades següents que s'hi passi el ratolí per sobre reutilitzen el
  // mateix valor, sense tornar a calcular-lo. Calcular-lo de nou cada cop
  // (encara que fos a partir del centre de la comarca, no del cursor) feia
  // que una comarca molt a prop del punt mig del mapa (com Urgell) pogués
  // sortir a un costat o a l'altre segons petites diferències de mesura
  // entre una vegada i la següent (per exemple si el popup canviava
  // lleugerament l'amplada de la pàgina en mostrar-se) — es notava com si
  // el popup anés saltant de banda en passar-hi el ratolí per sobre.
  const MARGE_POPUP = 16;
  const DESPLACAMENT_CURSOR = 20;
  let costatPopupActual = 'dreta';
  let posicioVerticalActual = 'baix';
  const posicioPerComarca = new Map(); // nom -> { h: 'esquerra'|'dreta', v: 'dalt'|'baix' }

  // Costat horitzontal (esquerra/dreta) i vertical (dalt/baix) on s'obre el
  // popup: es decideixen una única vegada per comarca i es guarden en
  // aquest mapa — totes les vegades següents que s'hi passi el ratolí per
  // sobre reutilitzen el mateix valor, sense tornar a calcular-lo.
  // Calcular-ho de nou cada cop (encara que fos a partir del centre de la
  // comarca, no del cursor) feia que una comarca prop del punt mig del
  // mapa, o prop de la vora superior/inferior (com Segrià o Noguera),
  // pogués sortir a un costat/posició o a l'altra segons petites
  // diferències de mesura entre una vegada i la següent — es notava com
  // si el popup anés saltant de banda, o pujant i baixant, en passar-hi
  // el ratolí per sobre.
  //
  // Horitzontal: es tria el costat que deixa MENYS mapa per tapar, segons
  // el centre de la comarca. El mapa de Ponent i Acció ocupa #map-wrap, a
  // la dreta del panell lateral; com més a prop estigui la comarca de la
  // vora esquerra d'aquest requadre, menys mapa hi ha entre ella i el
  // panell, així que convé obrir cap a l'esquerra (i a l'inrevés cap a la
  // dreta, prop de la vora dreta de la finestra).
  // Vertical: per defecte s'obre cap avall (com sempre ha fet); només puja
  // si no hi cabria per sota.
  // En ambdós casos es comprova aquí mateix si hi cap dins la finestra (i
  // es gira si cal), a partir d'un únic punt (el centre de la comarca) en
  // lloc de la posició canviant del cursor, perquè el resultat sigui
  // sempre el mateix.
  // Costats forçats a mà per a comarques on el càlcul automàtic (segons quin
  // costat deixa menys mapa per tapar) no dona el resultat volgut.
  const COSTAT_POPUP_FORÇAT = { 'Urgell': 'dreta' };

  function decideixPosicioPopup(nomComarca, layer) {
    if (posicioPerComarca.has(nomComarca)) return posicioPerComarca.get(nomComarca);
    const centreMapa = map.latLngToContainerPoint(layer.getBounds().getCenter());
    const mapContainerRect = map.getContainer().getBoundingClientRect();
    const clientX = mapContainerRect.left + centreMapa.x;
    const clientY = mapContainerRect.top + centreMapa.y;
    const mapRect = mapWrapEl.getBoundingClientRect();
    const vw = window.innerWidth;
    const vh = window.innerHeight;
    const width = popupEl.offsetWidth;
    const height = popupEl.offsetHeight;

    const espaiEsquerra = clientX - mapRect.left;
    const espaiDreta = mapRect.right - clientX;
    let h = COSTAT_POPUP_FORÇAT[nomComarca] || (espaiEsquerra < espaiDreta ? 'esquerra' : 'dreta');
    const capDreta = clientX + DESPLACAMENT_CURSOR + width + MARGE_POPUP <= vw;
    const capEsquerra = clientX - DESPLACAMENT_CURSOR - width - MARGE_POPUP >= 0;
    if (h === 'dreta' && !capDreta && capEsquerra) h = 'esquerra';
    else if (h === 'esquerra' && !capEsquerra && capDreta) h = 'dreta';

    let v = 'baix';
    const capBaix = clientY + DESPLACAMENT_CURSOR + height + MARGE_POPUP <= vh;
    const capDalt = clientY - DESPLACAMENT_CURSOR - height - MARGE_POPUP >= 0;
    if (!capBaix && capDalt) v = 'dalt';

    const posicio = { h, v };
    posicioPerComarca.set(nomComarca, posicio);
    return posicio;
  }

  function positionCustomPopup(clientX, clientY) {
    const margin = MARGE_POPUP;
    const cursorOffset = DESPLACAMENT_CURSOR;
    const vw = window.innerWidth;
    const vh = window.innerHeight;

    popupEl.style.maxHeight = 'none';
    popupEl.style.overflowY = 'visible';

    const width = popupEl.offsetWidth;
    let height = popupEl.offsetHeight;

    // El costat i la posició vertical ja venen decidits (i comprovat que
    // hi cabien) des de decideixPosicioPopup; aquí només se segueix la
    // posició del cursor, sense tornar a girar de banda ni de dalt/baix.
    let left = costatPopupActual === 'esquerra'
      ? clientX - cursorOffset - width
      : clientX + cursorOffset;
    left = Math.max(margin, Math.min(left, vw - width - margin));

    // Si la llista és tan llarga que no cap mai sencera en aquesta
    // finestra, l'ajustem a l'alçada de la pantalla amb scroll intern
    // (últim recurs, prioritzant que com a mínim es pugui llegir tota).
    const maxAvailable = vh - margin * 2;
    if (height > maxAvailable) {
      popupEl.style.maxHeight = maxAvailable + 'px';
      popupEl.style.overflowY = 'auto';
      height = maxAvailable;
    }

    let top = posicioVerticalActual === 'dalt'
      ? clientY - cursorOffset - height
      : clientY + cursorOffset;
    top = Math.max(margin, Math.min(top, vh - height - margin));

    popupEl.style.left = left + 'px';
    popupEl.style.top = top + 'px';
  }

  function showCustomPopup(nomComarca, layer, html, clientX, clientY) {
    popupEl.innerHTML = html;
    popupEl.style.display = 'block';
    const posicio = decideixPosicioPopup(nomComarca, layer);
    costatPopupActual = posicio.h;
    posicioVerticalActual = posicio.v;
    positionCustomPopup(clientX, clientY);
  }

  function hideCustomPopup() {
    popupEl.style.display = 'none';
  }

  function buildPopupHtml(c) {
    let itemsHtml;
    if (c.produccions.length === 0) {
      itemsHtml = `<div class="cp-empty">Sense produccions registrades</div>`;
    } else {
      itemsHtml = c.produccions.map(p => `
        <div class="cp-item">
          <div class="cp-nom">${p.nom}</div>
          <div class="cp-meta">
            <span class="cp-format">${p.format}</span>
            <span class="cp-impacte">${formatEuros(p.impacte)}</span>
          </div>
        </div>
      `).join("");
    }

    return `
      <div class="comarca-popup">
        <div class="cp-head">
          <h2>${c.nom}</h2>
          <div class="cp-stats">
            <div><b>${c.numProduccions}</b>produccions</div>
            <div><b>${formatEuros(c.totalImpacte)}</b>impacte total</div>
          </div>
        </div>
        <div class="cp-body">${itemsHtml}</div>
      </div>
    `;
  }

  // ---- Mapa fix, sense capa base ni possibilitat de desplaçar-se ----
  const map = L.map('map', {
    zoomControl: true,
    attributionControl: false,
    dragging: true,
    scrollWheelZoom: true,
    doubleClickZoom: true,
    boxZoom: true,
    keyboard: false,
    touchZoom: true,
    tap: false,
    // Per defecte Leaflet arrodoneix el zoom de fitBounds() al nivell
    // sencer més proper (zoomSnap: 1), cosa que pot arrodonir cap amunt
    // (més zoom) del que calia per encabir exactament els límits. Amb
    // zoomSnap:0 el zoom és continu, així fitBounds sempre encaixa amb
    // precisió, sense marge de sobra provocat només per l'arrodoniment.
    zoomSnap: 0
  });

  function targetStyle(c) {
    return {
      color: "#6b5a4a",
      weight: 1,
      fillColor: colorFor(c.numProduccions),
      fillOpacity: 1
    };
  }

  function targetHoverStyle(c) {
    return {
      color: "#14120f",
      weight: 2,
      fillOpacity: 1
    };
  }

  const contextStyle = {
    color: "#c9bda3",
    weight: 1.25,
    fillColor: "#ffffff",
    fillOpacity: 1
  };

  // Àrea i centroide d'un anell simple (fórmula del "shoelace"), en
  // coordenades [lon, lat]. Serveix per trobar el punt on col·locar el nom
  // dins la part més gran de cada comarca (evita que quedi entre trossos
  // separats en comarques amb geometria multi-part, com Pla d'Urgell).
  function ringArea(ring) {
    let a = 0;
    for (let i = 0; i < ring.length - 1; i++) {
      const [x1, y1] = ring[i];
      const [x2, y2] = ring[i + 1];
      a += x1 * y2 - x2 * y1;
    }
    return Math.abs(a) / 2;
  }

  function ringCentroid(ring) {
    let cx = 0, cy = 0, a = 0;
    for (let i = 0; i < ring.length - 1; i++) {
      const [x1, y1] = ring[i];
      const [x2, y2] = ring[i + 1];
      const cross = x1 * y2 - x2 * y1;
      a += cross;
      cx += (x1 + x2) * cross;
      cy += (y1 + y2) * cross;
    }
    a = a / 2;
    if (a === 0) {
      // Anell degenerat: mitjana simple de punts com a reserva
      const n = ring.length - 1;
      const sx = ring.slice(0, n).reduce((s, p) => s + p[0], 0);
      const sy = ring.slice(0, n).reduce((s, p) => s + p[1], 0);
      return [sx / n, sy / n];
    }
    return [cx / (6 * a), cy / (6 * a)];
  }

  function labelLatLngFor(feature) {
    let best = null;
    let bestArea = -1;
    feature.geometry.coordinates.forEach(polygon => {
      const outer = polygon[0];
      const area = ringArea(outer);
      if (area > bestArea) {
        bestArea = area;
        best = outer;
      }
    });
    const [lon, lat] = ringCentroid(best);
    return L.latLng(lat, lon);
  }

  // Fons per a la zona sense geometria disponible (p. ex. a l'oest de les
  // comarques carregades, cap a l'Aragó): gris llis, per marcar-la com a
  // "fora d'abast" del mapa, sense inventar-hi cap frontera. Va per sota de
  // tot: on sí que tenim geometria real (Catalunya, comarques de context,
  // les 16 comarques), les capes següents el tapen completament.
  const fonsSenseGeometria = L.rectangle(L.latLngBounds([38, -3], [44, 6]), {
    stroke: false,
    fillColor: "#b7b0a0",
    fillOpacity: 1,
    interactive: false
  }).addTo(map);

  // Silueta real d'Espanya (resta de comunitats autònomes), com a context
  // més enllà de Catalunya: patró de ratlles diagonals blanques sobre gris,
  // per distingir-la visualment de Catalunya. Va per sota del contorn de
  // Catalunya i de les comarques, que el tapen.
  const capaEspanya = L.geoJSON(espanyaGeoJSON, {
    style: {
      color: "#ddd6c7",
      weight: 0.6,
      fillOpacity: 1,
      interactive: false
    }
  }).addTo(map);

  // Leaflet recrea l'SVG (i hi perd els <defs> afegits a mà) cada vegada
  // que invalidateSize()/fitBounds() es tornen a executar — per això
  // aquesta funció és idempotent i es torna a cridar dins refitMap(), no
  // només un cop a l'inici.
  function aplicaPatroRatllat() {
    const svg = document.querySelector('#map svg');
    if (!svg) return;
    if (!svg.querySelector('#ratlles-fora-catalunya')) {
      const ns = "http://www.w3.org/2000/svg";
      const defs = document.createElementNS(ns, "defs");
      const pattern = document.createElementNS(ns, "pattern");
      pattern.setAttribute("id", "ratlles-fora-catalunya");
      pattern.setAttribute("width", "8");
      pattern.setAttribute("height", "8");
      pattern.setAttribute("patternUnits", "userSpaceOnUse");
      pattern.setAttribute("patternTransform", "rotate(45)");
      const bg = document.createElementNS(ns, "rect");
      bg.setAttribute("width", "8");
      bg.setAttribute("height", "8");
      bg.setAttribute("fill", "#b7b0a0");
      const ratlla = document.createElementNS(ns, "line");
      ratlla.setAttribute("x1", "0");
      ratlla.setAttribute("y1", "0");
      ratlla.setAttribute("x2", "0");
      ratlla.setAttribute("y2", "8");
      ratlla.setAttribute("stroke", "#ffffff");
      ratlla.setAttribute("stroke-width", "4");
      pattern.appendChild(bg);
      pattern.appendChild(ratlla);
      defs.appendChild(pattern);
      svg.insertBefore(defs, svg.firstChild);
    }
    capaEspanya.eachLayer(l => {
      const el = l.getElement();
      if (el) el.setAttribute('fill', 'url(#ratlles-fora-catalunya)');
    });
  }
  aplicaPatroRatllat();

  L.geoJSON(catalunyaGeoJSON, {
    style: {
      color: "#b7b0a0",
      weight: 1.25,
      dashArray: "5 4",
      fillOpacity: 0,
      interactive: false
    }
  }).addTo(map);

  // Context cartogràfic addicional: la resta de comarques de Barcelona,
  // Tarragona i Girona (fora de les 16 que ja tractem), només com a fons
  // amb nom — sense colors de produccions, popups ni interacció.
  // Geometria real dels mateixos fitxers .geojson, no una silueta
  // inventada.
  L.geoJSON(contextExteriorGeoJSON, {
    style: {
      color: "#c9bda3",
      weight: 1.25,
      fillColor: "#ffffff",
      fillOpacity: 1,
      interactive: false
    },
    onEachFeature: (feature, layer) => {
      L.tooltip({
        permanent: true,
        direction: 'center',
        className: 'comarca-label-context'
      })
        .setLatLng(labelLatLngFor(feature))
        .setContent(feature.properties.nom)
        .addTo(map);
    }
  }).addTo(map);

  const geoLayer = L.geoJSON(comarquesGeoJSON, {
    style: feature => {
      const c = comarquesByName[feature.properties.nom.trim()];
      return c ? targetStyle(c) : contextStyle;
    },
    onEachFeature: (feature, layer) => {
      const c = comarquesByName[feature.properties.nom.trim()];
      const labelPos = labelLatLngFor(feature);

      if (c) {
        capaPerComarca[c.nom] = layer;
        L.tooltip({
          permanent: true,
          direction: 'center',
          className: 'comarca-label'
        })
          .setLatLng(labelPos)
          .setContent(c.nom)
          .addTo(map);

        const html = buildPopupHtml(c);

        layer.on('mouseover', function (e) {
          // Mentre hi ha una comarca expandida (clicada), mentre el mapa
          // encara torna cap a la posició inicial d'haver-ne plegat una
          // (plegantComarca) o d'haver desseleccionat una producció
          // (desfixantProduccio), o mentre hi ha una producció seleccionada
          // amb zoom (des de la llista o des d'un punt del mapa), no es
          // mostra el popup de hover ni es ressalta cap comarca.
          if (comarcaExpandida || plegantComarca || desfixantProduccio || (nomSeleccionat && seleccioAmbZoom)) return;
          this.setStyle(targetHoverStyle(c));
          this.bringToFront();
          ressaltaComarca(c.nom, this);
          showCustomPopup(c.nom, this, html, e.originalEvent.clientX, e.originalEvent.clientY);
        });

        layer.on('mousemove', function (e) {
          if (comarcaExpandida || plegantComarca || desfixantProduccio || (nomSeleccionat && seleccioAmbZoom)) return;
          // Segueix el ratolí (posició), però sense recalcular costatPopupActual:
          // aquest ja es va decidir un sol cop a 'mouseover'.
          positionCustomPopup(e.originalEvent.clientX, e.originalEvent.clientY);
        });

        layer.on('mouseout', function () {
          // Si la comarca està expandida, es manté ressaltada; el popup de
          // hover sí que es tanca sempre (només és una previsualització).
          if (comarcaExpandida !== c.nom) {
            this.setStyle(targetStyle(c));
            treuRessalt(c.nom);
          }
          hideCustomPopup();
        });

        layer.on('click', function (e) {
          if (e.originalEvent) e.originalEvent.stopPropagation();
          if (acabaDArrossegar) return;
          // Si hi havia una producció seleccionada (des de la llista, amb
          // zoom), clicar una comarca la substitueix en lloc de quedar
          // bloquejat fins que l'usuari la desmarqui a mà: només es
          // netegen els elements visuals (sense el flyTo de tornada al
          // centre, ja que expandeixComarca() ja porta el mapa cap a la
          // comarca clicada tot seguit).
          if (nomSeleccionat) netejaSeleccioProduccio();
          expandeixComarca(c, this);
        });
      } else {
        // Comarca veïna: només context, sense interacció ni dades
        L.tooltip({
          permanent: true,
          direction: 'center',
          className: 'comarca-label-context'
        })
          .setLatLng(labelPos)
          .setContent(feature.properties.nom)
          .addTo(map);
        layer.options.interactive = false;
      }
    }
  }).addTo(map);

  // Encaixa la vista centrada en les 6 comarques d'interès. Calculat a
  // partir de la geometria real (no un rectangle escrit a mà): un
  // rectangle fix anterior no cobria del tot la forma real de Noguera,
  // Garrigues i Segrià, cosa que en pantalles amb una relació d'aspecte
  // més vertical (on la vertical és la dimensió que limita el fitBounds)
  // les retallava per dalt/baix. Amb .pad(0.03) es deixa un petit marge
  // perquè el traç i les etiquetes de les comarques del límit no quedin
  // enganxats a la vora mateixa del mapa.
  const comarquesObjectiuGeoJSON = {
    type: "FeatureCollection",
    features: comarquesGeoJSON.features.filter(f => f.properties.target)
  };
  const targetBounds = L.geoJSON(comarquesObjectiuGeoJSON).getBounds().pad(0.03);

  // Extensió de les 16 comarques carregades (les 6 objectiu + les de
  // context): defineix fins on es pot arrossegar el mapa en fer zoom in,
  // amb marge suficient per no topar amb el límit de seguida.
  const comarquesBounds = L.geoJSON(comarquesGeoJSON).getBounds();

  // Sense marges addicionals: fitBounds centra les comarques dins de la
  // zona visible del mapa (a la dreta del panell), amb el mateix espai
  // buit a banda i banda d'aquesta zona — que és el que es veu centrat de
  // debò. Compensar matemàticament l'amplada del panell (perquè el centre
  // coincidís amb el de tota la finestra, panell inclòs) feia l'efecte
  // contrari: arrambava les comarques contra el panell, amb un buit molt
  // gran a la dreta.
  const fitOptions = {
    paddingTopLeft: [0, 0],
    paddingBottomRight: [0, 0]
  };

  // Zoom de l'enquadrament inicial (les 6 comarques senceres), actualitzat
  // per refitMap(). Serveix de referència fixa per al lleuger zoom que fa
  // seleccionaProduccio(): sempre calcula el zoom de selecció a partir
  // d'AQUEST valor (constant), no del zoom actual del mapa — si no,
  // seleccionar produccions repetidament aniria acumulant zoom cada cop
  // més profund en lloc d'apropar-se sempre el mateix punt.
  let zoomBase = 0;

  // Capa amb els punts de la producció seleccionada (definida més avall,
  // però cal declarar-la aquí: actualitzaLimitsSegonsZoom() —que la fa
  // servir— ja s'executa un cop dins refitMap(), abans de la resta del
  // codi de selecció de produccions).
  let capaSeleccionada = null;

  // Recalcula la mida i l'enquadrament del mapa per al contenidor ACTUAL.
  // Cal desbloquejar temporalment min/maxZoom (si no, un fitBounds fet amb
  // el zoom bloquejat de l'enquadrament anterior no pot créixer ni encongir-
  // se) i després tornar a fixar el mínim (l'usuari pot apropar-se, però no
  // allunyar-se més enllà de l'enquadrament inicial) a l'escala correcta
  // per a la mida real del contenidor en cada moment.
  function refitMap(intent) {
    intent = intent || 0;
    map.invalidateSize();
    // Si el contenidor encara no té mida real (0×0) perquè el navegador
    // no ha acabat de maquetar la pàgina, un fitBounds ara bloquejaria el
    // mapa a un zoom erroni per sempre (setMinZoom/setMaxZoom el
    // congelen). Es reintenta al frame següent en lloc de continuar.
    const mida = map.getSize();
    if ((mida.x === 0 || mida.y === 0) && intent < 30) {
      requestAnimationFrame(() => refitMap(intent + 1));
      return;
    }
    map.setMinZoom(0);
    map.setMaxZoom(22);
    map.setMaxBounds(null);
    // animate:false garanteix que el nou centre/zoom s'apliquen a
    // l'instant, així el getZoom() següent sempre llegeix el valor
    // definitiu correcte (no un valor a mig animar).
    map.fitBounds(targetBounds, { ...fitOptions, animate: false });
    // El zoom-out màxim és la posició inicial mateixa: no es pot allunyar
    // més enllà de l'enquadrament d'entrada. L'apropament arriba fins a 2
    // nivells més (abans 3, i abans 5: es podia arribar a un apropament
    // excessiu).
    const zoomInicial = map.getZoom();
    zoomBase = zoomInicial;
    map.setMinZoom(zoomInicial);
    map.setMaxZoom(zoomInicial + 2);
    actualitzaLimitsSegonsZoom();
    aplicaPatroRatllat();
    dibuixaContornObjectiu();
  }

  // El marge d'arrossegament depèn del zoom: a la posició inicial (zoom-out
  // màxim) només es permet un petit marge, per poder ajustar lleugerament
  // el centrat de les comarques de Ponent i Acció sense poder allunyar-se'n;
  // en fer zoom in, el marge s'eixampla a tota l'extensió de les 16
  // comarques carregades, perquè es pugui arrossegar amb llibertat real
  // sense topar de seguida amb el límit.
  function actualitzaLimitsSegonsZoom() {
    map.dragging.enable();
    if (map.getZoom() <= map.getMinZoom()) {
      map.setMaxBounds(targetBounds.pad(0.08));
    } else if (capaSeleccionada || capaPuntsComarca) {
      // Producció seleccionada o comarca expandida: es treu del tot la
      // restricció d'arrossegament mentre estigui activa. No n'hi ha prou
      // amb ampliar els límits perquè continguin el punt (provat abans):
      // si el punt queda a prop de la vora, encara que el CENTRE hi
      // càpiga, el requadre visible sencer a aquest zoom pot sobresortir-
      // ne una mica, i Leaflet el torna a encaixar de cop — d'aquí la
      // petita estrebada. Es torna a aplicar la restricció normal en
      // desseleccionar/plegar (desfixaProduccio/plegaComarca criden
      // aquesta mateixa funció).
      map.setMaxBounds(null);
    } else {
      map.setMaxBounds(comarquesBounds.pad(0.15));
    }
  }
  map.on('zoomend', actualitzaLimitsSegonsZoom);
  map.on('dragend', () => {
    acabaDArrossegar = true;
    setTimeout(() => { acabaDArrossegar = false; }, 0);
  });

  // ---- Contorn exterior de les 6 comarques de Ponent i Acció ----
  // Ressegueix en vermell només la vora de fora del bloc format per les 6
  // comarques objectiu, sense dibuixar les fronteres internes que
  // comparteixen entre elles (p. ex. Pla d'Urgell, envoltada per altres
  // comarques objectiu, no hi surt marcada). S'obté descartant qualsevol
  // segment de vora que aparegui exactament dues vegades (una per cada
  // comarca objectiu veïna que el comparteix) i encadenant els que queden.
  function clauPunt(p) {
    return p[0].toFixed(6) + ',' + p[1].toFixed(6);
  }

  function contornExteriorObjectiu(features) {
    const comptesVora = new Map();
    const punts = new Map();

    features.forEach(f => {
      f.geometry.coordinates.forEach(poligon => {
        const anell = poligon[0];
        for (let i = 0; i < anell.length - 1; i++) {
          const p1 = anell[i], p2 = anell[i + 1];
          const k1 = clauPunt(p1), k2 = clauPunt(p2);
          punts.set(k1, p1);
          punts.set(k2, p2);
          const clauVora = k1 < k2 ? k1 + '|' + k2 : k2 + '|' + k1;
          comptesVora.set(clauVora, (comptesVora.get(clauVora) || 0) + 1);
        }
      });
    });

    // Adjacència a partir només de les vores que no es comparteixen entre
    // dues comarques objectiu (compte === 1): la vora exterior real.
    const adjacencia = new Map();
    comptesVora.forEach((compte, clauVora) => {
      if (compte !== 1) return;
      const [k1, k2] = clauVora.split('|');
      if (!adjacencia.has(k1)) adjacencia.set(k1, []);
      if (!adjacencia.has(k2)) adjacencia.set(k2, []);
      adjacencia.get(k1).push(k2);
      adjacencia.get(k2).push(k1);
    });

    // Encadena les vores restants en un o més anells tancats.
    const vistes = new Set();
    const anells = [];
    adjacencia.forEach((veins, inici) => {
      veins.forEach(primerVei => {
        if (vistes.has(inici + '>' + primerVei)) return;
        const claus = [inici];
        let anterior = inici, actual = primerVei;
        vistes.add(anterior + '>' + actual);
        vistes.add(actual + '>' + anterior);
        while (actual !== inici) {
          claus.push(actual);
          const veinsActual = adjacencia.get(actual) || [];
          const seguent = veinsActual.find(v => v !== anterior && !vistes.has(actual + '>' + v))
            ?? veinsActual.find(v => !vistes.has(actual + '>' + v));
          if (seguent === undefined) break;
          vistes.add(actual + '>' + seguent);
          vistes.add(seguent + '>' + actual);
          anterior = actual;
          actual = seguent;
        }
        if (actual === inici && claus.length > 2) {
          anells.push(claus.map(k => punts.get(k)));
        }
      });
    });

    return anells;
  }

  const comarquesObjectiu = comarquesObjectiuGeoJSON.features;

  // Es redibuixa dins refitMap() (no només un cop a l'inici): cal que el
  // mapa ja tingui una vista/projecció establerta abans de projectar
  // aquests punts, si no surt col·lapsat a un origen degenerat. Com que
  // refitMap() també s'executa en redimensionar/pantalla completa, es
  // treuen les capes anteriors abans de redibuixar per no acumular-les.
  // Pane propi per al contorn, per sobre del pane per defecte de les
  // comarques (overlayPane, z-index 400): en passar el ratolí per sobre
  // d'una comarca, el seu polígon fa bringToFront() dins el SEU pane —i
  // com que el mouseout no la torna mai enrere, es queda per sempre per
  // sobre del contorn si comparteixen pane, tapant-ne trossos allà on
  // coincideixen (es veu com si el contorn s'hagués fet més petit). Amb
  // un pane propi de z-index més alt, el contorn sempre queda per sobre,
  // independentment d'aquest reordenament. Mateix motiu que 'punts-pane'.
  map.createPane('contorn-pane');
  map.getPane('contorn-pane').style.zIndex = 420;

  // Pane pel resseguit (contorn) de la comarca seleccionada/hover, per
  // SOBRE del contorn exterior vermell (420): sense això, allà on el
  // contorn d'una comarca coincideix amb el contorn exterior de tota la
  // zona (és a dir, a les comarques que toquen la vora, no les que
  // només toquen altres comarques de la zona), el vermell tapava el
  // resseguit propi de la comarca — es veia complet només a les
  // comarques totalment envoltades per les altres (p. ex. Pla d'Urgell),
  // i tallat/incomplet a la resta, com si "ressegunssin" més fort unes
  // que altres.
  map.createPane('ressalt-pane');
  map.getPane('ressalt-pane').style.zIndex = 430;

  let capesContornObjectiu = [];
  function dibuixaContornObjectiu() {
    capesContornObjectiu.forEach(capa => map.removeLayer(capa));
    capesContornObjectiu = [];
    // Descarta anells minúsculs (uns pocs punts): soroll de precisió allà
    // on es toquen tres comarques, no contorn real.
    contornExteriorObjectiu(comarquesObjectiu).filter(anell => anell.length > 15).forEach(anell => {
      const capa = L.polygon(anell.map(([lon, lat]) => [lat, lon]), {
        pane: 'contorn-pane',
        color: "#c0392b",
        weight: 3,
        fill: false,
        interactive: false
      }).addTo(map);
      capesContornObjectiu.push(capa);
    });
  }

  refitMap();

  // Evita recalcular massa sovint durant un redimensionament continu
  let refitScheduled = false;
  function scheduleRefit() {
    if (refitScheduled) return;
    refitScheduled = true;
    requestAnimationFrame(() => {
      refitScheduled = false;
      refitMap();
    });
  }

  window.addEventListener('resize', scheduleRefit);

  // Canvis a pantalla completa (i variants amb prefix de navegador): la
  // transició de mida pot trigar uns instants a completar-se, per això
  // recalculem diverses vegades esglaonades (doble requestAnimationFrame
  // perquè el navegador hagi pintat la mida nova abans de mesurar-la, més
  // un parell de reintents amb retard per si la transició encara no ha
  // acabat).
  function refitAfterFullscreenChange() {
    requestAnimationFrame(() => {
      requestAnimationFrame(refitMap);
    });
    setTimeout(refitMap, 150);
    setTimeout(refitMap, 400);
    setTimeout(refitMap, 800);
  }

  ['fullscreenchange', 'webkitfullscreenchange', 'mozfullscreenchange', 'MSFullscreenChange']
    .forEach(evt => {
      document.addEventListener(evt, refitAfterFullscreenChange);
    });

  // Xarxa de seguretat addicional: detecta qualsevol canvi real de mida
  // del contenidor del mapa (independentment de si l'ha provocat un
  // redimensionament de finestra, pantalla completa, o el propi panell
  // de previsualització de l'artifact), sense dependre de quin esdeveniment
  // concret l'origini.
  if (typeof ResizeObserver !== 'undefined') {
    const mapWrapEl = document.getElementById('map-wrap');
    const resizeObserver = new ResizeObserver(() => scheduleRefit());
    resizeObserver.observe(mapWrapEl);
  }

  // ---- Llegenda de color a la capçalera ----
  const legendEl = document.getElementById('legend-swatches');
  palette.forEach(hex => {
    const sw = document.createElement('span');
    sw.style.background = hex;
    legendEl.appendChild(sw);
  });

  // ============================================================
  // PUNTS DE RODATGE — ubicació exacta de cada producció (Latitud/
  // Longitud al full de Google). És opcional: una producció sense
  // coordenades vàlides simplement no hi apareix, no trenca res.
  // ============================================================

  // Pane propi per als punts, per sobre del pane per defecte on van les
  // comarques (overlayPane, z-index 400): en passar el ratolí per sobre
  // d'una comarca, el seu polígon fa bringToFront() dins el SEU pane, cosa
